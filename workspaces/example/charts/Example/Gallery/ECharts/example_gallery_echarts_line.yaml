params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_line
  title: ECharts · 折线
  tags:
  - 图表原型
  - ECharts
  - line
  notes: 离线虚构数据，数值为演示单位；无需参数或连接。
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: axis
    grid:
      left: 12
      right: 12
      top: 24
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      data:
        from: sample
        field: label
    yAxis:
      type: value
      min: 0
    series:
    - type: line
      data:
        from: sample
        field: value
