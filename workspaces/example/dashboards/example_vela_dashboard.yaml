i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Vela · OHLCV 与技术指标
      en: Vela · OHLCV and technical indicators
    notes:
      zh-Hans: |-
        用同一份 40 日虚构行情比较基础蜡烛图与技术指标。价格单位为虚构价格点，成交量为虚构成交单位。
        第一页查看 OHLCV 与成交量；第二页查看均线、布林带、RSI、MACD，可调整 SMA 周期后应用。
        全部离线，无需连接；需要支持 renderer: vela 的 Facetra 版本。
      en: |-
        Compare basic candlesticks and technical indicators using the same forty days of fictional market data, in fictional price and trading units.
        The first tab shows OHLCV and volume; the second shows moving averages, Bollinger Bands, RSI and MACD. Adjust the SMA period and apply it.
        Entirely offline, with no connection required. Requires Facetra with renderer: vela support.
    ma_period:
      zh-Hans: 均线周期
      en: MA period
    ohlcv:
      zh-Hans: OHLCV
      en: OHLCV
    indicators:
      zh-Hans: 技术指标
      en: Technical indicators

version: 1
kind: Dashboard
metadata:
  id: example_vela_dashboard
  title: {i18n: title}
  tags: [股票, 行情, K线, Vela]
  notes: {i18n: notes}
params:
  - {name: ma_length, label: {i18n: ma_period}, type: integer, default: 10, minimum: 1, maximum: 5000}
tabs:
  - id: candles
    title: {i18n: ohlcv}
    panels:
      - id: candles
        chart: example_vela_candlestick
        height: 420
        params: {}
  - id: studies
    title: {i18n: indicators}
    panels:
      - id: studies
        chart: example_vela_indicators
        height: 600
        params:
          ma_length: {param: ma_length}
