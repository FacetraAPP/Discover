params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
chart:
  id: example_gallery_echarts_heatmap
  title: ECharts · 热力图
  dataset: sample
  renderer: echarts
  tags:
  - 图表原型
  - ECharts
  - heatmap
  notes: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    grid:
      top: 24
      bottom: 65
      left: 12
      right: 12
      containLabel: true
    xAxis:
      type: category
      data:
      - Mon
      - Tue
      - Wed
    yAxis:
      type: category
      data:
      - Web
      - Store
    visualMap:
      min: 0
      max: 6
      orient: horizontal
      left: center
      bottom: 0
      calculable: false
    series:
    - type: heatmap
      data:
      - - 0
        - 0
        - 2
      - - 1
        - 0
        - 5
      - - 2
        - 0
        - 3
      - - 0
        - 1
        - 4
      - - 1
        - 1
        - 1
      - - 2
        - 1
        - 6
      label:
        show: true
