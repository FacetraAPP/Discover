i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 配置示例
      en: ECharts · Configuration examples
    notes:
      zh-Hans: '通过股价、K 线、收入与利润率、渠道热力图探索虚构行情和经营数据。全部可离线查看。'
      en: 'Explore fictional market and business data through prices, candles, revenue and margin, and a channel heatmap. All charts work offline.'
    market:
      zh-Hans: 行情
      en: Market
    business:
      zh-Hans: 经营
      en: Business

metadata:
  tags: ["股票", "经营", "ECharts"]
  id: example_echarts_dashboard
  title: {i18n: title}
  notes: {i18n: notes}
version: 1
kind: Dashboard
params: []
tabs:
- id: market
  title: {i18n: market}
  panels:
  - id: price
    chart: example_echarts_price
    height: 3e+2
    params: {}
  - id: candles
    chart: example_echarts_candlestick
    height: 3.6e+2
    params: {}
- id: business
  title: {i18n: business}
  panels:
  - id: revenue
    chart: example_echarts_business
    height: 3.2e+2
    params: {}
  - id: channels
    chart: example_echarts_heatmap
    height: 3e+2
    params: {}
