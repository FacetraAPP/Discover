params:
- name: periods
  label: 显示最近（季度数）
  type: integer
  default: 20
  minimum: 1
  maximum: 200
  options:
  - 4
  - 8
  - 12
  - 20
  - 40
  - 80
  - 100
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-gdp
    format: json
    recordsPath:
    - data
dataset:
  id: gdp_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(period, '([0-9]{4})年', 1) || '-Q' || regexp_extract(period, '([1-4])季度', 1) AS period,
             TRY_CAST(gdp_yoy AS DOUBLE) AS gdp_yoy,
             TRY_CAST(primary_cumulative_yoy AS DOUBLE) AS primary_cumulative_yoy,
             TRY_CAST(secondary_cumulative_yoy AS DOUBLE) AS secondary_cumulative_yoy,
             TRY_CAST(tertiary_cumulative_yoy AS DOUBLE) AS tertiary_cumulative_yoy
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_gdp
  title: GDP · 累计同比
  dataset: gdp_data
  renderer: echarts
  notes: |-
    观察 GDP 及三次产业的累计同比增速。Q2 指上半年、Q3 指前三季度，不是单季度增速。单位：%。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/egodfcdg
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: gdp_data
        field: period
      axisLabel:
        showMinLabel: true
        showMaxLabel: true
        alignMinLabel: left
        alignMaxLabel: right
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: GDP
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: gdp_data
        field: gdp_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 第一产业
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: gdp_data
        field: primary_cumulative_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 第二产业
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: gdp_data
        field: secondary_cumulative_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 第三产业
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: gdp_data
        field: tertiary_cumulative_yoy
      symbolSize: 4
      showAllSymbol: auto
