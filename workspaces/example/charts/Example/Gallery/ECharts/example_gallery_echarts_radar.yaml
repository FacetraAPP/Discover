i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 雷达
      en: ECharts · Radar
    notes:
      zh-Hans: 离线虚构数据，数值为演示单位；无需参数或连接。
      en: Fictional offline data in demonstration units. No parameters or connections are required.
    speed:
      zh-Hans: 速度
      en: Speed
    cost:
      zh-Hans: 成本
      en: Cost
    quality:
      zh-Hans: 质量
      en: Quality
    reach:
      zh-Hans: 覆盖
      en: Reach
    prototype:
      zh-Hans: 样例
      en: Prototype

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_radar
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - radar
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    radar:
      radius: 60%
      indicator:
      - name: {i18n: speed}
        max: 10
      - name: {i18n: cost}
        max: 10
      - name: {i18n: quality}
        max: 10
      - name: {i18n: reach}
        max: 10
    series:
    - id: series_1
      type: radar
      areaStyle:
        opacity: 0.15
      data:
      - name: {i18n: prototype}
        value:
        - 8
        - 5
        - 9
        - 6
