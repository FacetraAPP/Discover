params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_gauge
  title: ECharts · 仪表盘
  tags:
  - 图表原型
  - ECharts
  - gauge
  notes: 虚构完成率 72%；百分比范围固定为 0–100。数据内嵌 chart.option。
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - type: gauge
      radius: 80%
      min: 0
      max: 100
      splitNumber: 5
      progress:
        show: true
        width: 12
      axisLine:
        lineStyle:
          width: 12
      axisLabel:
        distance: 16
        fontSize: 10
      detail:
        formatter: '{value}%'
        fontSize: 26
      data:
      - name: Complete
        value: 72
