i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Revenue and profit
      zh-Hans: Vega-Lite · 收入与利润
    notes:
      en: 'Explore the relationship between revenue and profit. Color distinguishes regions and point size represents units sold. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '比较收入与利润的关系；颜色区分地区，圆点大小表示销量（件）。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_scatter
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: point
      filled: true
      tooltip: true
    encoding:
      x:
        field: revenue
        type: quantitative
        title: Revenue (demo units)
      y:
        field: profit
        type: quantitative
        title: Profit (demo units)
      color:
        field: region
        type: nominal
        title: Region
      size:
        field: units
        type: quantitative
        title: Units
