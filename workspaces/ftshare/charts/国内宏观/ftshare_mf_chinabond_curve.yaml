i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 中债收益率 · 最新期限曲线
      en: ChinaBond yields · Latest term structure
    notes:
      zh-Hans: |-
        比较所选窗口内最后一个有数据日期的各期限收益率，单位年化%。横轴按期限顺序排列，不表示等距年数；可识别倒挂、平坦或陡峭结构。最后可用日期未必等于结束日期，须用同日数据理解整条曲线。报价为来源收益率曲线估计值，不是任一债券的保证回报。默认国债曲线、2026-08-01至2026-10-21，最多1000行。

        缺失值保留空白；观察期内无记录的日期不补点。数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/fubopatp
      en: |-
        Compare maturities on the last available date within the selected window, in annualized %. Maturities are ordinal categories rather than equally spaced years. The shape highlights inversion, flatness or steepness. The last available date may precede the window end; all points refer to that same date. Curve estimates are not guaranteed returns of an individual bond. Default: sovereign curve, 2026-08-01 to 2026-10-21, up to 1,000 rows.

        Missing values remain empty; dates without observations are not filled. Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/fubopatp
    param.start_date:
      zh-Hans: 开始日期
      en: Start date
    param.end_date:
      zh-Hans: 结束日期
      en: End date
    param.curve_name:
      zh-Hans: 收益率曲线
      en: Yield curve
    series.yield:
      zh-Hans: 收益率（%）
      en: Yield (%)
metadata:
  id: ftshare_mf_chinabond_curve
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - 国内宏观
  - 中债收益率曲线日度
params:
- name: start_date
  label:
    i18n: param.start_date
  type: date
  default: '2026-08-01'
- name: end_date
  label:
    i18n: param.end_date
  type: date
  default: '2026-10-21'
- name: curve_name
  label:
    i18n: param.curve_name
  type: string
  default: 中债国债收益率曲线
  options:
  - 中债国债收益率曲线
  - 中债中短期票据收益率曲线(AAA)
  - 中债商业银行普通债收益率曲线(AAA)
sources:
  remote:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/chinabond-yield-daily
    headers:
      FTSHARE_API_KEY: '{{ connections.ftshare.api_key | default('''') }}'
      Content-Type: application/json
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date | date_format(''yyyyMMdd'') }}'
      end_date: '{{ params.end_date | date_format(''yyyyMMdd'') }}'
      curve_name: '{{ params.curve_name }}'
      page: 1
      page_size: 1000
dataset:
  id: analysis
  sources:
  - id: raw
    ref: '#/sources/remote'
  sql: WITH latest AS (SELECT * FROM raw WHERE trade_date=(SELECT max(trade_date) FROM raw)) SELECT maturity AS
    period,yield FROM latest,LATERAL (VALUES ('3M',TRY_CAST(y_3m AS DOUBLE),0.25),('6M',TRY_CAST(y_6m AS DOUBLE),0.5),('1Y',TRY_CAST(y_1y
    AS DOUBLE),1),('3Y',TRY_CAST(y_3y AS DOUBLE),3),('5Y',TRY_CAST(y_5y AS DOUBLE),5),('7Y',TRY_CAST(y_7y AS DOUBLE),7),('10Y',TRY_CAST(y_10y
    AS DOUBLE),10),('30Y',TRY_CAST(y_30y AS DOUBLE),30)) t(maturity,yield,years) ORDER BY years
chart:
  dataset: analysis
  renderer: echarts
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(v) => v == null ? ''—'' : Number(v).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 58
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: analysis
        field: period
    yAxis:
      type: value
      name: '%'
      scale: true
    series:
    - id: yield
      name:
        i18n: series.yield
      type: line
      data:
        from: analysis
        field: yield
      showSymbol: true
      symbolSize: 4
      connectNulls: false
