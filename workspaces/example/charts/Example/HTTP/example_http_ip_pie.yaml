i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: HTTP 示例 · IP 分段
      en: HTTP example · IPv4 segments
    notes:
      zh-Hans: 通过 HTTP 获取公网 IPv4，将四段数字转换为饼图扇区。扇区大小按每段数值占总和的比例计算。
      en: Fetches the public IPv4 address over HTTP and turns its four numeric segments into pie sectors. Each
        sector shows that segment’s share of the sum.

params: []
sources:
  connection:
    source: http
    method: get
    url: '{{ connections.http_example.endpoint }}'
    params:
      format: json
    format: json
dataset:
  id: network
  sources:
  - id: raw
    ref: '#/sources/connection'
  sql: |-
    WITH segments AS (
      SELECT CAST(ip AS VARCHAR) AS ip, position,
             TRY_CAST(split_part(CAST(ip AS VARCHAR), '.', position) AS INTEGER) AS octet
      FROM raw CROSS JOIN range(1, 5) AS positions(position)
    )
    SELECT '第' || position || '段' AS segment,
           CASE WHEN regexp_full_match(ip, '[0-9]{1,3}([.][0-9]{1,3}){3}') AND octet BETWEEN 0 AND 255
                THEN octet ELSE error('HTTP example requires a valid IPv4 address.') END AS value
    FROM segments ORDER BY position
metadata:
  tags: ["HTTP", "网络", "饼图"]
  id: example_http_ip_pie
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: network
  renderer: default
  plot: pie
  x: segment
  y: value
