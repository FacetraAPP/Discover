i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Revenue spread by product
      zh-Hans: Vega-Lite · 产品收入箱线图
    notes:
      en: 'Compare revenue distributions by product and region, showing the minimum, quartiles, median and maximum. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '比较各产品在不同地区的收入分布，展示最小值、四分位数、中位数与最大值。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_boxplot
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: boxplot
      extent: min-max
    encoding:
      x:
        field: product
        type: nominal
      y:
        field: revenue
        type: quantitative
        title: Revenue (demo units)
      color:
        field: region
        type: nominal
        title: Region
