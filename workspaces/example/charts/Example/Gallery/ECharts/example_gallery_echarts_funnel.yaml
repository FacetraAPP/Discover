params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
chart:
  id: example_gallery_echarts_funnel
  title: ECharts · 漏斗
  dataset: sample
  renderer: echarts
  tags:
  - 图表原型
  - ECharts
  - funnel
  notes: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - type: funnel
      left: 12%
      width: 76%
      top: 10%
      bottom: 10%
      min: 0
      max: 100
      sort: descending
      gap: 4
      label:
        position: inside
        formatter: '{b}: {c}'
      data:
      - name: Visit
        value: 100
      - name: Browse
        value: 70
      - name: Cart
        value: 40
      - name: Buy
        value: 20
