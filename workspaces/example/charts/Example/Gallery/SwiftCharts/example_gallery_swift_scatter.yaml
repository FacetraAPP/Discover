i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Swift Charts · 散点 · PointMark
      en: Swift Charts · Scatter · PointMark
    notes:
      zh-Hans: '查看 5 个虚构观测的坐标关系，横轴保留数值之间的实际间距。'
      en: 'Explore the relationship between five fictional observations. The horizontal axis preserves numeric spacing.'

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-scatter.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT CAST(x AS DOUBLE) AS x, CAST(y AS DOUBLE) AS y FROM raw ORDER BY x
metadata:
  id: example_gallery_swift_scatter
  title: {i18n: title}
  tags:
  - 图表原型
  - Swift Charts
  - scatter
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: default
  plot: scatter
  x: x
  y: y
