i18n:
  defaultLocale: zh-Hans
  messages:
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    trading_days:
      zh-Hans: 交易日数
      en: Trading days
    ma_window:
      zh-Hans: 均线窗口
      en: MA window
    title:
      zh-Hans: ECharts · 股价与均线
      en: ECharts · Share price and moving average
    notes:
      zh-Hans: '虚构行情。与原生股价图共享 Dataset，SQL 计算均线，初始 NULL 保留为断点。

        点击图例切换序列，用鼠标或触摸手势缩放，悬停或轻触查看数值。'
      en: 'Fictional market data. Shares the native price chart’s dataset; SQL calculates
        the moving average and retains initial NULL values as gaps.

        Toggle series in the legend, zoom with mouse or touch, and hover or tap to
        inspect values.'
    close:
      zh-Hans: 收盘价
      en: Close
    moving_average:
      zh-Hans: 移动均线
      en: Moving average
params:
- name: symbol
  label:
    i18n: symbol
  type: string
  default: 600519.SH
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
- name: days
  label:
    i18n: trading_days
  type: integer
  default: 60
  minimum: 1
  maximum: 180
- name: ma_window
  label:
    i18n: ma_window
  type: integer
  default: 20
  minimum: 2
  maximum: 60
dataset:
  id: history
  ref: example_price.yaml#/dataset
  with:
    symbol:
      param: symbol
    days:
      param: days
    ma_window:
      param: ma_window
metadata:
  tags:
  - 股票
  - 行情
  - 均线
  - ECharts
  id: example_echarts_price
  title:
    i18n: title
  notes:
    i18n: notes
chart:
  dataset: history
  renderer: echarts
  scripts:
    price: '(value) => value == null ? ''—'' : ''¥'' + Number(value).toFixed(2)'
  option:
    color:
    - '#3b82f6'
    - '#f59e0b'
    legend:
      top: 4
    tooltip:
      trigger: axis
      valueFormatter:
        from: script
        name: price
    grid:
      left: 12
      right: 18
      top: 40
      bottom: 24
      containLabel: true
    xAxis:
      type: time
      boundaryGap: false
    yAxis:
      type: value
      scale: true
    dataZoom:
    - type: inside
      zoomOnMouseWheel: ctrl
    - type: slider
      show: false
      height: 20
      bottom: 4
    series:
    - name:
        i18n: close
      type: line
      data:
        from: history
        x: trade_date
        y: close
      showSymbol: false
      areaStyle:
        opacity: 0.08
    - name:
        i18n: moving_average
      type: line
      data:
        from: history
        x: trade_date
        y: ma
      showSymbol: false
      connectNulls: false
      lineStyle:
        type: dashed
    media:
    - query:
        maxWidth: 480
      option:
        grid:
          left: 8
          right: 12
          top: 36
          bottom: 20
          containLabel: true
        yAxis:
          splitNumber: 3
    - query:
        maxHeight: 190
      option:
        legend:
          show: false
        grid:
          top: 8
          bottom: 18
        yAxis:
          splitNumber: 2
