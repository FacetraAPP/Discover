i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · K 线
      en: ECharts · Candlestick
    notes:
      zh-Hans: 4 根虚构 K 线，数据顺序为 [开盘, 收盘, 最低, 最高]，单位为演示价格。
      en: Four fictional candles in [open, close, low, high] order, in demonstration price units.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_candlestick
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - candlestick
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    xAxis:
      type: category
      data:
      - Mon
      - Tue
      - Wed
      - Thu
    yAxis:
      type: value
      scale: true
    series:
    - id: series_1
      type: candlestick
      data:
      - - 10
        - 12
        - 9
        - 13
      - - 12
        - 11
        - 10
        - 14
      - - 11
        - 14
        - 10
        - 15
      - - 14
        - 13
        - 12
        - 16
