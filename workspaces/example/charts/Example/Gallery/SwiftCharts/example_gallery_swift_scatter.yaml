  title: Swift Charts · 散点 · PointMark
  dataset: sample
  renderer: default
  tags:
  - 图表原型
  - Swift Charts
  - scatter
  notes: 5 个虚构坐标。X 为真实数值轴，间距 1、2、3、2 不会按行号等距绘制。
  plot: scatter
  x: x
  y: y
