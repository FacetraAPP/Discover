i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 个股分析
      en: Stock analysis
    notes:
      zh-Hans: 选择共享参数后点应用。近期成交分页固定展示 30 个交易日。
      en: Choose shared parameters, then apply them. The recent-volume tab always shows thirty trading days.
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    trading_days:
      zh-Hans: 交易日数
      en: Trading days
    ma_window:
      zh-Hans: 均线窗口
      en: MA window
    overview:
      zh-Hans: 概览
      en: Overview
    recent_volume:
      zh-Hans: 近期成交
      en: Recent volume

metadata:
  tags: ["股票", "行情", "分析"]
  id: example_dashboard
  title: {i18n: title}
  notes: {i18n: notes}
version: 1
kind: Dashboard
params:
- name: symbol
  label: {i18n: symbol}
  type: string
  required: true
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
  advanced: false
  default: 600519.SH
- name: days
  label: {i18n: trading_days}
  type: integer
  required: true
  minimum: 1e+0
  maximum: 1.8e+2
  options:
  - 30
  - 60
  - 120
  - 180
  advanced: false
  default: 60
- name: ma_window
  label: {i18n: ma_window}
  type: integer
  required: true
  minimum: 2e+0
  maximum: 6e+1
  advanced: true
  default: 20
tabs:
- id: overview
  title: {i18n: overview}
  panels:
  - id: price_main
    chart: example_price
    height: 2.4e+2
    params:
      symbol:
        param: symbol
      days:
        param: days
      ma_window:
        param: ma_window
  - id: volume_main
    chart: example_volume
    height: 2e+2
    params:
      symbol:
        param: symbol
      days:
        param: days
- id: detail
  title: {i18n: recent_volume}
  panels:
  - id: volume_recent
    chart: example_volume
    height: 2.4e+2
    params:
      symbol:
        param: symbol
      days: 30
