i18n:
  defaultLocale: zh-Hans
  messages:
    metric:
      zh-Hans: 指标
      en: Metric
    title:
      zh-Hans: ECharts · 渠道月度热力图
      en: ECharts · Monthly channel heatmap
    notes:
      zh-Hans: '按月份与渠道比较收入或分摊成本后的利润，单位为万元。使用虚构经营数据；切换收入或利润后，通过颜色深浅和提示框查看金额。'
      en: 'Compare monthly revenue or profit after allocated costs across channels, in CNY 10,000. Uses fictional business data. Choose revenue or profit, then inspect amounts through color intensity and tooltips.'
    online:
      zh-Hans: 线上
      en: Online
    store:
      zh-Hans: 门店
      en: Store
    month_1:
      zh-Hans: 1月
      en: Jan
    month_2:
      zh-Hans: 2月
      en: Feb
    month_3:
      zh-Hans: 3月
      en: Mar
    month_4:
      zh-Hans: 4月
      en: Apr
    month_5:
      zh-Hans: 5月
      en: May
    month_6:
      zh-Hans: 6月
      en: Jun
    month_7:
      zh-Hans: 7月
      en: Jul
    month_8:
      zh-Hans: 8月
      en: Aug
    month_9:
      zh-Hans: 9月
      en: Sep
    month_10:
      zh-Hans: 10月
      en: Oct
    month_11:
      zh-Hans: 11月
      en: Nov
    month_12:
      zh-Hans: 12月
      en: Dec
    online_amount:
      zh-Hans: 线上（万元）
      en: Online (CNY 10,000)
    store_amount:
      zh-Hans: 门店（万元）
      en: Store (CNY 10,000)
params:
- name: metric
  label:
    i18n: metric
  type: string
  required: true
  options:
  - revenue
  - profit
  advanced: false
  default: revenue
sources:
  sales:
    ref: example_echarts_business.yaml#/sources/sales
dataset:
  id: cells
  sources:
  - id: raw
    ref: '#/sources/sales'
  sql: |
    WITH sales AS (
      SELECT month, CAST(online AS DOUBLE) AS online, CAST(retail AS DOUBLE) AS retail,
             CAST(cost AS DOUBLE) AS cost FROM raw
    )
    SELECT CAST(substr(month, 6, 2) AS INTEGER) - 1 AS month_index, 0 AS channel_index,
           CASE WHEN $metric = 'profit' THEN round(online - cost * online / (online + retail), 1) ELSE online END AS value
    FROM sales
    UNION ALL
    SELECT CAST(substr(month, 6, 2) AS INTEGER) - 1, 1,
           CASE WHEN $metric = 'profit' THEN round(retail - cost * retail / (online + retail), 1) ELSE retail END
    FROM sales ORDER BY channel_index, month_index
metadata:
  tags:
  - 经营
  - 渠道
  - 热力图
  - ECharts
  id: example_echarts_heatmap
  title:
    i18n: title
  notes:
    i18n: notes
chart:
  dataset: cells
  renderer: echarts
  option:
    yAxis:
      data:
      - i18n: online
      - i18n: store
      splitArea:
        show: true
      type: category
    xAxis:
      type: category
      splitArea:
        show: true
      data:
      - i18n: month_1
      - i18n: month_2
      - i18n: month_3
      - i18n: month_4
      - i18n: month_5
      - i18n: month_6
      - i18n: month_7
      - i18n: month_8
      - i18n: month_9
      - i18n: month_10
      - i18n: month_11
      - i18n: month_12
    tooltip:
      position: top
    grid:
      top: 30
      bottom: 80
      containLabel: true
      right: 12
      left: 10
    media:
    - query:
        minWidth: 481
      option:
        series:
        - label:
            show: true
          id: online
        - label:
            show: true
          id: store
    - option:
        visualMap:
          calculable: false
          textStyle:
            fontSize: 10
          itemHeight: 120
          itemWidth: 10
        series:
        - label:
            show: false
          id: online
        - label:
            show: false
          id: store
        xAxis:
          axisLabel:
            interval: 1
        grid:
          right: 6
          containLabel: true
          bottom: 58
          top: 12
          left: 6
      query:
        maxWidth: 480
    - query:
        maxHeight: 190
      option:
        grid:
          top: 8
          bottom: 18
        series:
        - label:
            show: false
          id: online
        - label:
            show: false
          id: store
        visualMap:
          show: false
    series:
    - id: online
      name:
        i18n: online_amount
      label:
        fontSize: 10
        show: true
      type: heatmap
      emphasis:
        itemStyle:
          borderColor: '#f59e0b'
          borderWidth: 2
      datasetId: online_cells
      encode:
        x: month_index
        y: channel_index
        value: value
        tooltip:
        - value
    - id: store
      name:
        i18n: store_amount
      label:
        fontSize: 10
        show: true
      type: heatmap
      emphasis:
        itemStyle:
          borderColor: '#f59e0b'
          borderWidth: 2
      datasetId: store_cells
      encode:
        x: month_index
        y: channel_index
        value: value
        tooltip:
        - value
    visualMap:
      max: 150
      orient: horizontal
      min: 0
      bottom: 8
      left: center
      calculable: true
      inRange:
        color:
        - '#e0f2fe'
        - '#38bdf8'
        - '#0369a1'
    dataset:
    - id: raw_cells
      dimensions:
      - month_index
      - channel_index
      - value
      source:
        from: cells
        rows: true
    - id: online_cells
      fromDatasetId: raw_cells
      transform:
        type: filter
        config:
          dimension: channel_index
          '=': 0
    - id: store_cells
      fromDatasetId: raw_cells
      transform:
        type: filter
        config:
          dimension: channel_index
          '=': 1
