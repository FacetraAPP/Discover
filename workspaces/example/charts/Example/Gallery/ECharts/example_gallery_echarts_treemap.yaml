i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 矩形树图
      en: ECharts · Treemap
    notes:
      zh-Hans: '比较虚构产品与服务各子类别的占比，矩形面积表示演示数值。可离线查看。'
      en: 'Compare subcategory shares for fictional products and services. Rectangle area represents demonstration values. Works offline.'
    products:
      zh-Hans: 产品
      en: Products
    tools:
      zh-Hans: 工具
      en: Tools
    books:
      zh-Hans: 书籍
      en: Books
    services:
      zh-Hans: 服务
      en: Services
    design:
      zh-Hans: 设计
      en: Design
    support:
      zh-Hans: 支持
      en: Support

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_treemap
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - treemap
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: treemap
      data:
      - name: {i18n: products}
        children:
        - name: {i18n: tools}
          value: 12
        - name: {i18n: books}
          value: 8
      - name: {i18n: services}
        children:
        - name: {i18n: design}
          value: 9
        - name: {i18n: support}
          value: 6
      roam: false
      nodeClick: false
      breadcrumb:
        show: false
      upperLabel:
        show: true
        height: 22
      label:
        show: true
      levels:
      - {}
      - itemStyle:
          borderWidth: 3
          gapWidth: 3
