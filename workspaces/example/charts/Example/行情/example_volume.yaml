i18n:
  defaultLocale: zh-Hans
  messages:
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    trading_days:
      zh-Hans: 交易日数
      en: Trading days
    title:
      zh-Hans: 成交量
      en: Trading volume
params:
- name: symbol
  label:
    i18n: symbol
  type: string
  required: true
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
  advanced: false
  default: 600519.SH
- name: days
  label:
    i18n: trading_days
  type: integer
  required: true
  minimum: 1e+0
  maximum: 180.0
  options:
  - 30
  - 60
  - 120
  - 180
  advanced: false
  default: 60
sources: {}
dataset:
  id: volume
  sources:
  - id: prices
    ref: example_price.yaml#/sources/prices
    with:
      symbol:
        param: symbol
  sql: "WITH recent AS (\n  SELECT CAST(trade_date AS DATE) AS trade_date, CAST(volume\
    \ AS BIGINT) AS volume\n  FROM prices WHERE symbol = $symbol\n  ORDER BY trade_date\
    \ DESC LIMIT $days\n)\nSELECT * FROM recent ORDER BY trade_date"
metadata:
  tags:
  - 股票
  - 行情
  - 成交量
  id: example_volume
  title:
    i18n: title
  notes: ''
chart:
  dataset: volume
  renderer: echarts
  option:
    tooltip:
      trigger: axis
    grid:
      left: 12
      right: 18
      top: 24
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      data:
        from: volume
        field: trade_date
    yAxis:
      type: value
      scale: true
    series:
    - type: bar
      data:
        from: volume
        field: volume
