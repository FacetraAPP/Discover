i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 日历热力图
      en: ECharts · Calendar heatmap
    notes:
      zh-Hans: '在日历上查看 4 条虚构观测。缺失日期留空，不补零。'
      en: 'View four fictional observations on a calendar. Missing dates remain blank rather than becoming zero.'

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_calendar
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - calendar
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    calendar:
      range:
      - '2026-01-01'
      - '2026-01-14'
      left: 45
      right: 15
      top: 35
      bottom: 65
      cellSize:
      - auto
      - auto
      yearLabel:
        show: false
      monthLabel:
        show: false
      dayLabel:
        firstDay: 1
    visualMap:
      min: 0
      max: 10
      orient: horizontal
      left: center
      bottom: 0
    series:
    - id: series_1
      type: heatmap
      coordinateSystem: calendar
      data:
      - - '2026-01-01'
        - 3
      - - '2026-01-04'
        - 8
      - - '2026-01-08'
        - 5
      - - '2026-01-12'
        - 9
