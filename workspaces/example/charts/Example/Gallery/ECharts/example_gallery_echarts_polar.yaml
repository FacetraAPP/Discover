params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_polar
  title: ECharts · 极坐标柱状
  tags:
  - 图表原型
  - ECharts
  - polar
  notes: 离线虚构数据，数值为演示单位；无需参数或连接。
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    polar:
      radius: 65%
    angleAxis:
      type: category
      data:
      - A
      - B
      - C
      - D
    radiusAxis:
      type: value
      min: 0
    series:
    - type: bar
      coordinateSystem: polar
      data:
        from: sample
        field: value
