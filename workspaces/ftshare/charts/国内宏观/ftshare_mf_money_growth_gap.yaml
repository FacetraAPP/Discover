i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 货币活化 · M1与M2增速差
      en: Monetary activity · M1–M2 growth gap
    notes:
      zh-Hans: |-
        以M1同比减M2同比观察交易性货币相对广义货币的增长速度，单位百分点。正值仅表示M1增长更快，不代表新增信贷或可直接归因于股市流入。2025年起M1统计定义调整，跨定义时期的长期比较应谨慎。默认最近24个观测期，缺少任一增速时不计算差值。

        缺失值保留空白；观察期内无记录的日期不补点。数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/twl6t7h1
      en: |-
        Subtract M2 year-on-year growth from M1 growth to compare transaction-money expansion with broad money, in percentage points. Positive values mean faster M1 growth, not new lending or equity inflows. China changed the M1 definition from 2025; comparisons across definitions need care. Defaults to 24 observations; a missing input leaves the spread empty.

        Missing values remain empty; dates without observations are not filled. Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/twl6t7h1
    param.periods:
      zh-Hans: 最近期数
      en: Recent observations
    series.gap:
      zh-Hans: M1−M2（百分点）
      en: M1−M2 (pp)
metadata:
  id: ftshare_mf_money_growth_gap
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - 国内宏观
  - 货币供应
params:
- name: periods
  label:
    i18n: param.periods
  type: integer
  default: 24
  options:
  - 12
  - 24
  - 48
  - 96
sources:
  remote:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-money-supply
    headers:
      FTSHARE_API_KEY: '{{ connections.ftshare.api_key | default('''') }}'
      Content-Type: application/json
    format: json
    recordsPath:
    - data
    - items
    params:
      page: 1
      page_size: 200
dataset:
  id: analysis
  sources:
  - id: raw
    ref: '#/sources/remote'
  sql: WITH n AS (SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月',
    1), 2, '0') || '-01' AS period,TRY_CAST(m1_yoy AS DOUBLE)-TRY_CAST(m2_yoy AS DOUBLE) AS gap FROM raw) SELECT
    * FROM (SELECT * FROM n ORDER BY period DESC LIMIT $periods) r ORDER BY period
chart:
  dataset: analysis
  renderer: echarts
  option:
    tooltip:
      trigger: axis
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 58
      bottom: 30
      containLabel: true
    xAxis:
      type: time
      boundaryGap: true
    yAxis:
      type: value
      name: pp
      scale: false
    series:
    - id: gap
      name:
        i18n: series.gap
      type: bar
      data:
        from: analysis
        x: period
        y: gap
      markLine:
        silent: true
        symbol: none
        label:
          show: false
        data:
        - yAxis: 0
