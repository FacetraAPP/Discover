i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: PPI · 同比与环比
      en: PPI · Year-on-year and month-on-month
    notes:
      zh-Hans: |-
        观察工业生产者出厂价格的同比趋势和当月环比变化。单位：%。

        可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
        数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/n6lijleg
      en: |-
        Track year-on-year trends and monthly changes in industrial producer prices. Unit: %.

        Choose the number of observations. Dates run in ascending order. Tap a line for dates and values, and use the legend to show or hide series. Missing values are not filled with zero.
        Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/n6lijleg

params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-ppi
    format: json
    recordsPath:
    - data
    - items
    params:
      page: 1
      page_size: '{{ params.periods }}'
dataset:
  id: ppi_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(yoy AS DOUBLE) AS yoy,
             TRY_CAST(mom AS DOUBLE) AS mom
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
metadata:
  tags: ["国内宏观", "物价", "工业", "PPI"]
  id: ftshare_china_ppi
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: ppi_data
  renderer: echarts
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: ppi_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 同比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: ppi_data
        field: yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 环比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: ppi_data
        field: mom
      symbolSize: 4
      showAllSymbol: auto
