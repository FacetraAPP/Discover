i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 进出口 · 同比
      en: Imports and exports · Year-on-year
    notes:
      zh-Hans: |-
        比较出口与进口当月同比，观察外需和内需相关变化。单位：%。

        可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
        数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/n6bu5izh
      en: |-
        Compare monthly year-on-year growth in exports and imports to track changes related to external and domestic demand. Unit: %.

        Choose the number of observations. Dates run in ascending order. Tap a line for dates and values, and use the legend to show or hide series. Missing values are not filled with zero.
        Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/n6bu5izh

params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-customs-trade
    format: json
    recordsPath:
    - data
dataset:
  id: trade_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(export_yoy AS DOUBLE) AS export_yoy,
             TRY_CAST(import_yoy AS DOUBLE) AS import_yoy
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
metadata:
  tags: ["国内宏观", "贸易", "进出口"]
  id: ftshare_china_trade
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: trade_data
  renderer: echarts
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: trade_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 出口
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: trade_data
        field: export_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 进口
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: trade_data
        field: import_yoy
      symbolSize: 4
      showAllSymbol: auto
