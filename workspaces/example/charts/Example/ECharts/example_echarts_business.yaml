i18n:
  defaultLocale: zh-Hans
  messages:
    months:
      zh-Hans: 月数
      en: Months
    revenue_target:
      zh-Hans: 收入目标
      en: Revenue target
    show_labels:
      zh-Hans: 显示标签
      en: Show labels
    title:
      zh-Hans: ECharts · 收入与利润率
      en: ECharts · Revenue and profit margin
    notes:
      zh-Hans: |-
        12 个月的虚构经营数据，金额单位为万元。柱状图堆叠线上与门店收入，右轴显示利润率。
        months 由 SQL 控制；target 绑定目标线；show_labels 直接绑定 ECharts 的 label.show。
      en: |-
        Twelve months of fictional business data, in units of CNY 10,000. Bars stack online and store revenue; the right axis shows profit margin.
        SQL controls months; target sets the target line; show_labels binds directly to ECharts label.show.
    target:
      zh-Hans: 目标
      en: Target
    online:
      zh-Hans: 线上
      en: Online
    store:
      zh-Hans: 门店
      en: Store
    margin:
      zh-Hans: 利润率
      en: Profit margin
    amount_unit:
      zh-Hans: 万元
      en: CNY 10,000

params:
- name: months
  label: {i18n: months}
  type: integer
  required: true
  minimum: 3e+0
  maximum: 1.2e+1
  advanced: false
  default: 12
- name: target
  label: {i18n: revenue_target}
  type: number
  required: true
  minimum: 0e+0
  maximum: 4e+2
  advanced: false
  default: 170
- name: show_labels
  label: {i18n: show_labels}
  type: boolean
  required: true
  advanced: false
  default: false
sources:
  sales:
    source: duckdb
    file: data/example/echarts-sales.csv
dataset:
  id: sales
  sources:
  - id: raw
    ref: '#/sources/sales'
  sql: |
    WITH recent AS (
      SELECT month, CAST(online AS DOUBLE) AS online, CAST(retail AS DOUBLE) AS retail,
             CAST(cost AS DOUBLE) AS cost
      FROM raw ORDER BY month DESC LIMIT $months
    )
    SELECT month, online, retail, online + retail - cost AS profit,
           round(100 * (online + retail - cost) / (online + retail), 1) AS margin
    FROM recent ORDER BY month
metadata:
  tags: ["经营", "收入", "利润率", "ECharts"]
  id: example_echarts_business
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: sales
  renderer: echarts
  option:
    media:
    - query:
        maxWidth: 480
      option:
        legend:
          top: 0
          type: scroll
        xAxis:
          axisLabel:
            interval: 1
        yAxis:
        - splitNumber: 3
        - splitNumber: 3
        grid:
          containLabel: true
          top: 44
          left: 6
          bottom: 12
          right: 6
    - query:
        maxHeight: 190
      option:
        grid:
          bottom: 16
          top: 8
        yAxis:
        - splitNumber: 2
          name: ''
        - splitNumber: 2
          name: ''
        xAxis:
          axisLabel:
            interval: 3
        legend:
          show: false
    grid:
      top: 48
      left: 10
      containLabel: true
      bottom: 16
      right: 10
    series:
    - id: series_1
      markLine:
        data:
        - yAxis:
            from: params
            name: target
        symbol: none
        label:
          formatter: {i18n: target}
      name: {i18n: online}
      stack: revenue
      data:
        from: sales
        field: online
      label:
        show:
          from: params
          name: show_labels
      type: bar
    - id: series_2
      name: {i18n: store}
      data:
        field: retail
        from: sales
      label:
        show:
          name: show_labels
          from: params
      stack: revenue
      type: bar
    - id: series_3
      type: line
      tooltip:
        valueFormatter: 'js: (v) => Number(v).toFixed(1) + ''%'''
      name: {i18n: margin}
      smooth: true
      data:
        field: margin
        from: sales
      yAxisIndex: 1
    legend:
      top: 4
    color:
    - '#3b82f6'
    - '#14b8a6'
    - '#f59e0b'
    yAxis:
    - type: value
      name: {i18n: amount_unit}
    - axisLabel:
        formatter: '{value}%'
      name: {i18n: margin}
      type: value
    xAxis:
      axisLabel:
        formatter: 'js: (v) => v.slice(5)'
      type: category
      data:
        field: month
        from: sales
    tooltip:
      trigger: axis
