i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Regional small multiples
      zh-Hans: Vega-Lite · 地区分面
    notes:
      en: 'Compare monthly revenue trends in a separate view for each region. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '在独立图中比较不同地区的月度收入趋势。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_facet
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    facet:
      field: region
      type: nominal
      title: Region
    columns: 1
    spec:
      width: 200
      height: 110
      mark:
        type: line
        point: true
        tooltip: true
      encoding:
        x:
          field: month
          type: temporal
          timeUnit: yearmonth
          axis:
            format: '%b'
            labelOverlap: true
          title: Month
        y:
          aggregate: sum
          field: revenue
          type: quantitative
          title: Revenue (demo units)
