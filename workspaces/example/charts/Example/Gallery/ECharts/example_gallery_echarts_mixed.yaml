i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 柱线组合
      en: ECharts · Bar and line
    notes:
      zh-Hans: 离线虚构数据，数值为演示单位；无需参数或连接。
      en: Fictional offline data in demonstration units. No parameters or connections are required.
    quantity:
      zh-Hans: 数量
      en: Quantity
    reference:
      zh-Hans: 参照
      en: Reference

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_mixed
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - mixed
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: axis
    grid:
      top: 44
      bottom: 24
      left: 12
      right: 12
      containLabel: true
    xAxis:
      type: category
      data:
        from: sample
        field: label
    yAxis:
      type: value
      min: 0
    legend:
      top: 0
    series:
    - id: series_1
      type: bar
      name: {i18n: quantity}
      data:
        from: sample
        field: value
    - id: series_2
      type: line
      name: {i18n: reference}
      data:
        from: sample
        field: other
