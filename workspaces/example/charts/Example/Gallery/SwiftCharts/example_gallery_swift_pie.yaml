i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Swift Charts · 饼图 · SectorMark
      en: Swift Charts · Pie · SectorMark
    notes:
      zh-Hans: 离线虚构数据，数值为演示单位；无需参数或连接。
      en: Fictional offline data in demonstration units. No parameters or connections are required.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT label, CAST(value AS DOUBLE) AS value FROM raw ORDER BY label
metadata:
  id: example_gallery_swift_pie
  title: {i18n: title}
  tags:
  - 图表原型
  - Swift Charts
  - pie
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: default
  plot: pie
  x: label
  y: value
