params:
- name: start_date
  label: 开始日期（YYYYMMDD）
  type: string
  default: '20260801'
- name: end_date
  label: 结束日期（YYYYMMDD）
  type: string
  default: '20260831'
- name: page
  label: 页码
  type: integer
  default: 1
  minimum: 1
  advanced: true
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/wz-index-daily
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date }}'
      end_date: '{{ params.end_date }}'
      page: '{{ params.page }}'
      page_size: 1000
dataset:
  id: wenzhou_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT CAST(date AS VARCHAR) AS period,
             TRY_CAST(comp_rate AS DOUBLE) AS comp_rate,
             TRY_CAST(center_rate AS DOUBLE) AS center_rate,
             TRY_CAST(micro_rate AS DOUBLE) AS micro_rate,
             TRY_CAST(sdb_rate AS DOUBLE) AS sdb_rate
      FROM raw
    )
    SELECT * FROM normalized WHERE period <> '' ORDER BY period
chart:
  id: ftshare_china_wenzhou
  title: 温州民间融资 · 综合与分项利率
  dataset: wenzhou_data
  renderer: echarts
  notes: |-
    FTShare 国内宏观：温州民间融资 · 综合与分项利率。单位：%。默认查询 2026 年 8 月；可调整日期和页码，每页最多 1000 条。缺报和非交易日不填充。 文档：https://market.ft.tech/gateway/doc/p/e4w9tgm2
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2)'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 16
      top: 56
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: wenzhou_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 综合利率
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: wenzhou_data
        field: comp_rate
    - name: 借贷服务中心
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: wenzhou_data
        field: center_rate
    - name: 小额贷款公司
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: wenzhou_data
        field: micro_rate
    - name: 民间资本管理公司
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: wenzhou_data
        field: sdb_rate
