i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 面积
      en: ECharts · Area
    notes:
      zh-Hans: 离线虚构数据，数值为演示单位；无需参数或连接。
      en: Fictional offline data in demonstration units. No parameters or connections are required.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_area
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - area
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: axis
    grid:
      left: 12
      right: 12
      top: 24
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      data:
        from: sample
        field: label
    yAxis:
      type: value
      min: 0
    series:
    - id: series_1
      type: line
      data:
        from: sample
        field: value
      areaStyle: {}
