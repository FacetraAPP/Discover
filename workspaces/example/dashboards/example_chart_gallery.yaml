i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 图表原型
      en: Chart Gallery
    notes:
      zh-Hans: '浏览 37 个图形示例，涵盖常用统计图、层级、关系、流向、地图与数值卡片。全部使用离线虚构数据，无需参数或连接。'
      en: 'Browse 37 chart examples covering common statistics, hierarchies, relationships, flows, maps and a value card. All use fictional offline data without parameters or connections.'
    swift_charts:
      zh-Hans: Swift Charts
      en: Swift Charts
    echarts_basics:
      zh-Hans: ECharts · 基础
      en: ECharts · Basics
    echarts_structures:
      zh-Hans: ECharts · 结构
      en: ECharts · Structures
    echarts_more:
      zh-Hans: ECharts · 更多
      en: ECharts · More

