i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Monthly revenue
      zh-Hans: Vega-Lite · 月度收入
    notes:
      en: "Fictional monthly product sales, January–June 2026. Revenue/profit use\
        \ demonstration units; units are counts. No credentials or network required.\n\
        \n**Data:** open the table and select **Dataset Result** to inspect typed\
        \ SQL output, or select a source to compare the original CSV.\n\n```mermaid\n\
        flowchart LR\n  CSV --> SQL\n  SQL --> Chart\n```"
      zh-Hans: "2026 年 1–6 月的虚构产品销售数据。收入与利润采用演示单位，销量单位为件。无需连接或网络。\n\n**数据：**打开表格，选择\
        \ **Dataset 结果** 检查 SQL 输出，或选择数据源对照原始 CSV。\n\n```mermaid\nflowchart LR\n \
        \ CSV --> SQL\n  SQL --> Chart\n```"
metadata:
  id: vega_bar
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources:
  sales:
    source: duckdb
    file: data/example/renderer-sales.csv
dataset:
  id: sales
  sources:
  - id: raw
    ref: '#/sources/sales'
  sql: SELECT CAST(month AS DATE) AS month, region, product, CAST(revenue AS DOUBLE)
    AS revenue, CAST(profit AS DOUBLE) AS profit, CAST(units AS BIGINT) AS units FROM
    raw ORDER BY month, region, product
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: bar
      tooltip: true
    encoding:
      x:
        field: month
        type: temporal
        title: Month
        timeUnit: yearmonth
        axis:
          format: '%b'
          labelOverlap: true
      y:
        aggregate: sum
        field: revenue
        type: quantitative
        title: Revenue (demo units)
