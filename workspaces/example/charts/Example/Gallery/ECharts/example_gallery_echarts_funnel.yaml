i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 漏斗
      en: ECharts · Funnel
    notes:
      zh-Hans: '比较访问、浏览、加购与购买四个阶段的虚构数量，观察逐步减少的过程。数值为演示单位，可离线查看。'
      en: 'Compare fictional counts for visits, browsing, cart additions and purchases to see the drop across stages. Values use demonstration units and work offline.'
    visit:
      zh-Hans: 访问
      en: Visits
    browse:
      zh-Hans: 浏览
      en: Browsing
    cart:
      zh-Hans: 购物车
      en: Cart
    buy:
      zh-Hans: 购买
      en: Purchases

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_funnel
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - funnel
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: funnel
      left: 12%
      width: 76%
      top: 10%
      bottom: 10%
      min: 0
      max: 100
      sort: descending
      gap: 4
      label:
        position: inside
        formatter: '{b}: {c}'
      data:
      - name: {i18n: visit}
        value: 100
      - name: {i18n: browse}
        value: 70
      - name: {i18n: cart}
        value: 40
      - name: {i18n: buy}
        value: 20
