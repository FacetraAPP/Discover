i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 桑基图
      en: ECharts · Sankey
    notes:
      zh-Hans: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
      en: Structured fictional samples are embedded directly in chart.option, with a shared four-row CSV as
        the executable dataset. No network, parameters or connections are required.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_sankey
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - sankey
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: sankey
      left: 10%
      right: 15%
      top: 12%
      bottom: 12%
      nodeWidth: 18
      nodeGap: 20
      label:
        fontSize: 12
      lineStyle:
        color: source
        curveness: 0.5
      data:
      - name: A
      - name: B
      - name: C
      - name: D
      links:
      - source: A
        target: B
        value: 5
      - source: A
        target: C
        value: 3
      - source: B
        target: D
        value: 5
      - source: C
        target: D
        value: 3
