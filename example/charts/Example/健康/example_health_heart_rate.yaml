params: []
sources:
  health:
    source: healthkit
    metric: heart_rate
    days: 30
dataset:
  id: daily_health
  sources:
  - id: raw
    ref: '#/sources/health'
  sql: SELECT date, value, unit FROM raw ORDER BY date
chart:
  id: example_health_heart_rate
  title: 健康 · 每日平均心率（次/分钟）
  dataset: daily_health
  renderer: default
  notes: 最近 30 天心率样本的每日平均值，单位次/分钟，不是静息心率或实时心率。 请在设置开启健康数据，并在系统健康授权页面允许读取；缺失日期不补零。
  plot: line
  x: date
  y: value
