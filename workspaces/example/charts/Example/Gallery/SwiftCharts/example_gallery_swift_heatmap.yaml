i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Swift Charts · 热力图 · RectangleMark
      en: Swift Charts · Heatmap · RectangleMark
    notes:
      zh-Hans: '比较 3 天内两个渠道的 6 个虚构数值，颜色深浅表示大小。数值为演示单位。'
      en: 'Compare six fictional values across three days and two channels. Color intensity indicates magnitude, in demonstration units.'

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-heatmap.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT day, channel, CAST(value AS DOUBLE) AS value FROM raw
metadata:
  id: example_gallery_swift_heatmap
  title: {i18n: title}
  tags:
  - 图表原型
  - Swift Charts
  - heatmap
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: default
  plot: heatmap
  x: day
  y: channel
  color: value
