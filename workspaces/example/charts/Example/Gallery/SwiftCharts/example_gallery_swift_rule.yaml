i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Swift Charts · 区间 · RuleMark
      en: Swift Charts · Intervals · RuleMark
    notes:
      zh-Hans: 3 个虚构任务的区间，单位为天。chart.x / x_end 为数值起止，chart.y 为任务分类。
      en: Intervals for three fictional tasks, in days. chart.x / x_end are numeric start/end positions; chart.y
        is the task category.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-intervals.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT task, CAST(start AS DOUBLE) AS start, CAST("end" AS DOUBLE) AS "end" FROM raw ORDER BY start
metadata:
  id: example_gallery_swift_rule
  title: {i18n: title}
  tags:
  - 图表原型
  - Swift Charts
  - rule
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: default
  plot: rule
  x: start
  x_end: end
  y: task
