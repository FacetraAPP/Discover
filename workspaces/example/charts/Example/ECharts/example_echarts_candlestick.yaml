i18n:
  defaultLocale: zh-Hans
  messages:
    trading_days:
      zh-Hans: 交易日数
      en: Trading days
    ma_window:
      zh-Hans: 均线窗口
      en: MA window
    title:
      zh-Hans: ECharts · K 线与成交量
      en: ECharts · Candlesticks and volume
    notes:
      zh-Hans: '40 个交易日的离线虚构 OHLCV。K 线数据按 open、close、low、high 顺序绑定。

        上下两个 grid 共享缩放；均线由 SQL 计算；成交量用 color_by 跟随当日涨跌。'
      en: 'Forty trading days of fictional offline OHLCV data. Candlestick values
        are bound in open, close, low, high order.

        The two grids share zoom; SQL calculates the moving average; color_by colors
        volume by the day’s price movement.'
    candlestick:
      zh-Hans: K线
      en: Candlestick
    moving_average:
      zh-Hans: 均线
      en: Moving average
    volume:
      zh-Hans: 成交量
      en: Volume
params:
- name: days
  label:
    i18n: trading_days
  type: integer
  default: 30
  minimum: 5
  maximum: 40
- name: ma_window
  label:
    i18n: ma_window
  type: integer
  default: 5
  minimum: 2
  maximum: 20
sources:
  prices:
    source: duckdb
    file: data/example/echarts-ohlcv.csv
dataset:
  id: candles
  sources:
  - id: raw
    ref: '#/sources/prices'
  sql: "WITH typed AS (\n  SELECT trade_date, CAST(open AS DOUBLE) AS open, CAST(close\
    \ AS DOUBLE) AS close,\n         CAST(low AS DOUBLE) AS low, CAST(high AS DOUBLE)\
    \ AS high, CAST(volume AS BIGINT) AS volume\n  FROM raw\n), history AS (\n  SELECT\
    \ *, CASE WHEN count(*) OVER w >= $ma_window THEN avg(close) OVER w END AS ma\n\
    \  FROM typed WINDOW w AS (ORDER BY trade_date ROWS BETWEEN ($ma_window - 1) PRECEDING\
    \ AND CURRENT ROW)\n), recent AS (SELECT * FROM history ORDER BY trade_date DESC\
    \ LIMIT $days)\nSELECT * FROM recent ORDER BY trade_date\n"
metadata:
  tags:
  - 股票
  - 行情
  - K线
  - ECharts
  id: example_echarts_candlestick
  title:
    i18n: title
  notes:
    i18n: notes
chart:
  dataset: candles
  renderer: echarts
  option:
    legend:
      top: 0
      data:
      - i18n: candlestick
      - i18n: moving_average
      - i18n: volume
    tooltip:
      trigger: axis
      axisPointer:
        type: cross
    axisPointer:
      link:
      - xAxisIndex: all
    grid:
    - left: 52
      right: 12
      top: 35
      height: 48%
    - left: 52
      right: 12
      top: 68%
      height: 16%
    xAxis:
    - type: category
      data:
        from: candles
        field: trade_date
      boundaryGap: true
      axisLabel:
        show: false
    - type: category
      gridIndex: 1
      data:
        from: candles
        field: trade_date
      axisLabel:
        formatter: 'js: (v) => v.slice(5)'
    yAxis:
    - type: value
      scale: true
    - type: value
      gridIndex: 1
      splitNumber: 2
      axisLabel:
        formatter: 'js: (v) => (v / 1000).toFixed(0) + "k"'
    dataZoom:
    - type: inside
      xAxisIndex:
      - 0
      - 1
      zoomOnMouseWheel: ctrl
    - type: slider
      show: false
      xAxisIndex:
      - 0
      - 1
      height: 16
      bottom: 0
    series:
    - name:
        i18n: candlestick
      type: candlestick
      data:
        from: candles
        fields:
        - open
        - close
        - low
        - high
      itemStyle:
        color: '#26a69a'
        color0: '#ef5350'
        borderColor: '#26a69a'
        borderColor0: '#ef5350'
    - name:
        i18n: moving_average
      type: line
      data:
        from: candles
        field: ma
      showSymbol: false
      lineStyle:
        width: 1.5
        color: '#f59e0b'
    - name:
        i18n: volume
      type: bar
      xAxisIndex: 1
      yAxisIndex: 1
      data:
        from: candles
        field: volume
        color_by:
        - close
        - open
    media:
    - query:
        maxWidth: 480
      option:
        grid:
        - left: 42
          right: 8
          top: 36
          height: 47%
        - left: 42
          right: 8
          top: 68%
          height: 18%
        xAxis:
        - axisLabel:
            show: false
        - axisLabel:
            interval: 6
        yAxis:
        - splitNumber: 3
        - splitNumber: 2
    - query:
        maxHeight: 190
      option:
        legend:
          show: false
        grid:
        - left: 36
          right: 8
          top: 8
          height: 75%
        - top: 100%
          height: 0
        xAxis:
        - axisLabel:
            show: true
            interval: 9
            formatter: 'js: (v) => v.slice(5)'
        - show: false
        yAxis:
        - splitNumber: 2
        - show: false
        series:
        - {}
        - {}
        - data: []
