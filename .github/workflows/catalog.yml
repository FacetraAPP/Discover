name: Validate YAML and build Discover catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-catalog-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate workspace, chart and dashboard YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run validator and catalog regression tests
        run: python -m unittest discover -s tests -v
      - name: Check every workspace, chart and dashboard
        run: python scripts/build_catalog.py --revision "$(git rev-parse HEAD)" --validate-only

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate and publish immutable-source catalog
        run: |
          revision=$(git rev-parse HEAD)
          python scripts/build_catalog.py --revision "$revision" --output "$RUNNER_TEMP/catalog"
          python scripts/publish_catalog.py --revision "$revision" --output "$RUNNER_TEMP/catalog"
