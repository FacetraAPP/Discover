i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 极坐标柱状
      en: ECharts · Polar bars
    notes:
      zh-Hans: 离线虚构数据，数值为演示单位；无需参数或连接。
      en: Fictional offline data in demonstration units. No parameters or connections are required.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_polar
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - polar
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    polar:
      radius: 65%
    angleAxis:
      type: category
      data:
      - A
      - B
      - C
      - D
    radiusAxis:
      type: value
      min: 0
    series:
    - id: series_1
      type: bar
      coordinateSystem: polar
      data:
        from: sample
        field: value
