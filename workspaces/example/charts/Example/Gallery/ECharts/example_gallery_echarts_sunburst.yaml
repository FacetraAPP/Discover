i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 旭日图
      en: ECharts · Sunburst
    notes:
      zh-Hans: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
      en: Structured fictional samples are embedded directly in chart.option, with a shared four-row CSV as
        the executable dataset. No network, parameters or connections are required.
    products:
      zh-Hans: 产品
      en: Products
    tools:
      zh-Hans: 工具
      en: Tools
    books:
      zh-Hans: 书籍
      en: Books
    services:
      zh-Hans: 服务
      en: Services
    design:
      zh-Hans: 设计
      en: Design
    support:
      zh-Hans: 支持
      en: Support

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_sunburst
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - sunburst
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: sunburst
      data:
      - name: {i18n: products}
        children:
        - name: {i18n: tools}
          value: 12
        - name: {i18n: books}
          value: 8
      - name: {i18n: services}
        children:
        - name: {i18n: design}
          value: 9
        - name: {i18n: support}
          value: 6
      radius:
      - 0
      - 80%
      label:
        rotate: radial
        fontSize: 11
