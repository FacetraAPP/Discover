i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Monthly revenue
      zh-Hans: Vega-Lite · 月度收入
    notes:
      en: 'Compare total revenue by month. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '比较各月的收入总额。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_bar
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources:
  sales:
    source: duckdb
    file: data/example/renderer-sales.csv
dataset:
  id: sales
  sources:
  - id: raw
    ref: '#/sources/sales'
  sql: SELECT CAST(month AS DATE) AS month, region, product, CAST(revenue AS DOUBLE)
    AS revenue, CAST(profit AS DOUBLE) AS profit, CAST(units AS BIGINT) AS units FROM
    raw ORDER BY month, region, product
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: bar
      tooltip: true
    encoding:
      x:
        field: month
        type: temporal
        title: Month
        timeUnit: yearmonth
        axis:
          format: '%b'
          labelOverlap: true
      y:
        aggregate: sum
        field: revenue
        type: quantitative
        title: Revenue (demo units)
