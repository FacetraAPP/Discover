params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-pmi
    format: json
    recordsPath:
    - data
    - items
    params:
      page: 1
      page_size: '{{ params.periods }}'
dataset:
  id: pmi_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(manufacturing_pmi AS DOUBLE) AS manufacturing_pmi,
             TRY_CAST(non_manufacturing_pmi AS DOUBLE) AS non_manufacturing_pmi
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  tags: ["国内宏观", "景气指数", "制造业", "PMI"]
  id: ftshare_china_pmi
  title: PMI · 制造业与非制造业
  dataset: pmi_data
  renderer: echarts
  notes: |-
    50 是荣枯分界：高于 50 为扩张，低于 50 为收缩。比较制造业与非制造业景气。单位：指数点。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/s4xvqnu0
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + '' 点'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: pmi_data
        field: period
    yAxis:
      type: value
      name: 指数点
      scale: true
      min: js:(e) => Math.floor(Math.min(e.min, 50) - 1)
      max: js:(e) => Math.ceil(Math.max(e.max, 50) + 1)
    series:
    - name: 制造业
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: pmi_data
        field: manufacturing_pmi
      markLine:
        symbol: none
        label:
          formatter: 50 荣枯线
          position: insideEndTop
          distance: 6
        lineStyle:
          type: dashed
        data:
        - yAxis: 50
      symbolSize: 4
      showAllSymbol: auto
    - name: 非制造业
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: pmi_data
        field: non_manufacturing_pmi
      symbolSize: 4
      showAllSymbol: auto
