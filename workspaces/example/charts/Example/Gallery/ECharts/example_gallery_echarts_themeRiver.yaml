i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 主题河流
      en: ECharts · Theme river
    notes:
      zh-Hans: 4 个 ISO 日期、2 个渠道的 8 条虚构记录，数据格式为 [日期, 数值, 系列名]。
      en: Eight fictional observations for two channels across four ISO dates, in [date, value, series name]
        format.
    web:
      zh-Hans: 线上
      en: Web
    store:
      zh-Hans: 门店
      en: Store

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_themeRiver
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - themeRiver
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    legend:
      top: 0
      data:
      - {i18n: web}
      - {i18n: store}
    singleAxis:
      type: time
      top: 45
      bottom: 35
      left: 32
      right: 32
      axisLabel:
        formatter: '{MM}-{dd}'
        hideOverlap: true
      splitNumber: 3
      minInterval: 86400000
      maxInterval: 86400000
    series:
    - id: series_1
      type: themeRiver
      data:
      - - '2026-01-01'
        - 3
        - {i18n: web}
      - - '2026-01-01'
        - 5
        - {i18n: store}
      - - '2026-01-02'
        - 5
        - {i18n: web}
      - - '2026-01-02'
        - 4
        - {i18n: store}
      - - '2026-01-03'
        - 8
        - {i18n: web}
      - - '2026-01-03'
        - 3
        - {i18n: store}
      - - '2026-01-04'
        - 6
        - {i18n: web}
      - - '2026-01-04'
        - 5
        - {i18n: store}
      label:
        show: false
