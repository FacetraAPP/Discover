i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Facetra · 数值卡片
      en: Facetra · Value card
    notes:
      zh-Hans: 4 个虚构数值的总和 75，由 Rust 计算并返回单个值。
      en: The sum of four fictional values, 75, is computed by Rust and returned as one value.
params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT SUM(CAST(value AS DOUBLE)) AS total FROM raw
metadata:
  id: example_gallery_value
  title:
    i18n: title
  tags:
  - 图表原型
  - value
  notes:
    i18n: notes
chart:
  dataset: sample
  renderer: value
  value: total
