params:
- name: periods
  label: 显示最近（月数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-fixed-asset-investment
    format: json
    recordsPath:
    - data
dataset:
  id: fixed_asset_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(yoy AS DOUBLE) AS yoy,
             TRY_CAST(mom AS DOUBLE) AS mom
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_fixed_asset
  title: 固定资产投资 · 同比与环比
  dataset: fixed_asset_data
  renderer: echarts
  notes: |-
    观察固定资产投资当月同比和环比。增速可能受低基数影响。单位：%。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/vp2bmxs5
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: fixed_asset_data
        field: period
      axisLabel:
        showMinLabel: true
        showMaxLabel: true
        alignMinLabel: left
        alignMaxLabel: right
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 同比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: fixed_asset_data
        field: yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 环比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: fixed_asset_data
        field: mom
      symbolSize: 4
      showAllSymbol: auto
