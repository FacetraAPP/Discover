params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_tree
  title: ECharts · 树图
  tags:
  - 图表原型
  - ECharts
  - tree
  notes: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - type: tree
      data:
      - name: Root
        children:
        - name: Products
          children:
          - name: Tools
            value: 12
          - name: Books
            value: 8
        - name: Services
          children:
          - name: Design
            value: 9
          - name: Support
            value: 6
      left: 15%
      right: 24%
      top: 12%
      bottom: 12%
      symbolSize: 12
      initialTreeDepth: -1
      label:
        position: left
        fontSize: 11
      leaves:
        label:
          position: right
          fontSize: 11
      expandAndCollapse: false
