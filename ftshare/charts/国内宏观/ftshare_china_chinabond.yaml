params:
- name: start_date
  label: 开始日期（YYYYMMDD）
  type: string
  default: '20260801'
- name: end_date
  label: 结束日期（YYYYMMDD）
  type: string
  default: '20260831'
- name: page
  label: 页码
  type: integer
  default: 1
  minimum: 1
  advanced: true
- name: curve_name
  label: 收益率曲线（精确名称）
  type: string
  default: 中债国债收益率曲线
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/chinabond-yield-daily
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date }}'
      end_date: '{{ params.end_date }}'
      page: '{{ params.page }}'
      page_size: 1000
      curve_name: '{{ params.curve_name }}'
dataset:
  id: chinabond_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT CAST(trade_date AS VARCHAR) AS period,
             TRY_CAST(y_1y AS DOUBLE) AS y_1y,
             TRY_CAST(y_5y AS DOUBLE) AS y_5y,
             TRY_CAST(y_10y AS DOUBLE) AS y_10y,
             TRY_CAST(y_30y AS DOUBLE) AS y_30y
      FROM raw
    )
    SELECT * FROM normalized WHERE period <> '' ORDER BY period
chart:
  id: ftshare_china_chinabond
  title: 中债国债收益率 · 期限比较
  dataset: chinabond_data
  renderer: echarts
  notes: |-
    FTShare 国内宏观：中债国债收益率 · 期限比较。单位：%。默认查询 2026 年 8 月；可调整日期和页码，每页最多 1000 条。缺报和非交易日不填充。 文档：https://market.ft.tech/gateway/doc/p/fubopatp
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2)'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 16
      top: 56
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: chinabond_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 1 年
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: chinabond_data
        field: y_1y
    - name: 5 年
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: chinabond_data
        field: y_5y
    - name: 10 年
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: chinabond_data
        field: y_10y
    - name: 30 年
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: chinabond_data
        field: y_30y
