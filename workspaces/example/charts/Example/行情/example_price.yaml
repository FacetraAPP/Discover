i18n:
  defaultLocale: zh-Hans
  messages:
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    trading_days:
      zh-Hans: 交易日数
      en: Trading days
    ma_window:
      zh-Hans: 均线窗口
      en: MA window
    title:
      zh-Hans: 股价与均线
      en: Share price and moving average
    notes:
      zh-Hans: 虚构历史行情与股票信息，CSV 通过 DuckDB 读取。
      en: Fictional historical prices and stock information, read from CSV with DuckDB.

params:
- name: symbol
  label: {i18n: symbol}
  type: string
  required: true
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
  advanced: false
  default: 600519.SH
- name: days
  label: {i18n: trading_days}
  type: integer
  required: true
  minimum: 1e+0
  maximum: 1.8e+2
  options:
  - 30
  - 60
  - 120
  - 180
  advanced: false
  default: 60
- name: ma_window
  label: {i18n: ma_window}
  type: integer
  required: true
  minimum: 2e+0
  maximum: 6e+1
  advanced: true
  default: 20
sources:
  prices:
    source: duckdb
    file: data/example/stock-daily.csv
  symbols:
    source: duckdb
    file: data/example/symbols.csv
dataset:
  id: prices
  sources:
  - id: prices
    ref: '#/sources/prices'
  - id: symbols
    ref: '#/sources/symbols'
  sql: |-
    WITH history AS (
      SELECT p.symbol, s.name AS symbol_name, CAST(p.trade_date AS DATE) AS trade_date,
        CAST(p.close AS DOUBLE) AS close,
        CASE WHEN COUNT(*) OVER w >= $ma_window THEN
          AVG(CAST(p.close AS DOUBLE)) OVER w END AS ma
      FROM prices p LEFT JOIN symbols s ON p.symbol = s.symbol
      WHERE p.symbol = $symbol
      WINDOW w AS (ORDER BY p.trade_date ROWS BETWEEN ($ma_window - 1) PRECEDING AND CURRENT ROW)
    ), recent AS (
      SELECT * FROM history ORDER BY trade_date DESC LIMIT $days
    )
    SELECT * FROM recent ORDER BY trade_date
metadata:
  tags: ["股票", "行情", "均线"]
  id: example_price
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: prices
  renderer: default
  plot: line
  x: trade_date
  y: close
  average: ma
