i18n:
  defaultLocale: zh-Hans
  messages:
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    title:
      zh-Hans: 月度均价
      en: Monthly average price
    notes:
      zh-Hans: '查看所选股票每月的平均收盘价，价格为演示单位。使用虚构行情，可离线查看。'
      en: 'View the selected stock’s average closing price by month, in demonstration price units. Uses fictional market data and works offline.'

params:
- name: symbol
  label: {i18n: symbol}
  type: string
  required: true
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
  advanced: false
  default: 600519.SH
sources: {}
dataset:
  id: monthly
  sources:
  - id: prices
    ref: example_price.yaml#/sources/prices
    with:
      symbol:
        param: symbol
  - id: symbols
    ref: example_price.yaml#/sources/symbols
  sql: |-
    SELECT strftime(CAST(p.trade_date AS DATE), '%Y-%m') AS month,
           s.name AS symbol_name,
           AVG(CAST(p.close AS DOUBLE)) AS average_close,
           COUNT(*) AS trading_days,
           CAST(SUM(CAST(p.volume AS BIGINT)) AS BIGINT) AS volume
    FROM prices p LEFT JOIN symbols s ON p.symbol = s.symbol
    WHERE p.symbol = $symbol
    GROUP BY month, s.name
    ORDER BY month
metadata:
  tags: ["股票", "月度", "聚合"]
  id: example_monthly
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: monthly
  renderer: default
  plot: bar
  x: month
  y: average_close
