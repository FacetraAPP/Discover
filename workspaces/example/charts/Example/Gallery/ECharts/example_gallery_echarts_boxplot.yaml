i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 箱线图
      en: ECharts · Box plot
    notes:
      zh-Hans: 3 组虚构的 [最小值, Q1, 中位数, Q3, 最大值]，直接内嵌 chart.option。单位为演示单位。
      en: Three fictional [minimum, Q1, median, Q3, maximum] groups embedded directly in chart.option, in demonstration
        units.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_boxplot
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - boxplot
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    xAxis:
      type: category
      data:
      - A
      - B
      - C
    yAxis:
      type: value
      min: 0
    series:
    - id: series_1
      type: boxplot
      data:
      - - 1
        - 3
        - 5
        - 7
        - 9
      - - 2
        - 4
        - 6
        - 8
        - 10
      - - 1
        - 2
        - 4
        - 6
        - 8
