params:
  - {name: ma_length, label: 均线周期, type: integer, default: 10, minimum: 1, maximum: 5000}

sources:
  prices: {source: duckdb, file: data/example/echarts-ohlcv.csv}

dataset:
  id: candles
  sources: [{id: raw, ref: '#/sources/prices'}]
  sql: |
    SELECT CAST(trade_date AS DATE) AS time,
           CAST(open AS DOUBLE) AS open, CAST(high AS DOUBLE) AS high,
           CAST(low AS DOUBLE) AS low, CAST(close AS DOUBLE) AS close,
           CAST(volume AS BIGINT) AS volume
    FROM raw
    ORDER BY time

chart:
  id: example_vela_indicators
  title: Vela · K 线与技术指标
  tags: [股票, 行情, K线, 均线, Vela]
  notes: |-
    40 个交易日的虚构行情；价格单位为虚构价格点，成交量为虚构成交单位。
    SMA、EMA 和布林带叠加主图，RSI 与 MACD 各用独立副图；均线周期可通过参数调整。
    指标基于全部 40 行计算，预热期保留空值；需要支持 renderer: vela 的 Facetra 版本。
  dataset: candles
  renderer: vela
  option:
    time: time
    open: open
    high: high
    low: low
    close: close
    volume: volume
    time_unit: iso8601
    timeframe: 1d
    indicators:
      - type: sma
        inputs: {length: {from: params, name: ma_length}, color: '#f59e0b'}
      - type: ema
        inputs: {length: 20, color: '#3b82f6'}
      - type: bollinger-bands
        inputs: {length: 20, mult: 2}
      - type: rsi
        inputs: {length: 14}
      - type: macd
        inputs: {fastLength: 12, slowLength: 26, signalLength: 9}
