params: []
sources:
  health:
    source: healthkit
    metric: active_energy
    days: 30
dataset:
  id: daily_health
  sources:
  - id: raw
    ref: '#/sources/health'
  sql: SELECT date, value, unit FROM raw ORDER BY date
chart:
  id: example_health_active_energy
  title: 健康 · 每日活动能量（kcal）
  dataset: daily_health
  renderer: default
  notes: 最近 30 天的每日活动能量，单位 kcal，不包含静息能量。 请在设置开启健康数据，并在系统健康授权页面允许读取；缺失日期不补零。
  plot: bar
  x: date
  y: value
