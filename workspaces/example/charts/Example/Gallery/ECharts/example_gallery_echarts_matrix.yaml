i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 矩阵坐标
      en: ECharts · Matrix coordinates
    notes:
      zh-Hans: ECharts 6+ matrix 坐标系：3 列 × 2 行，6 个虚构散点，颜色绑定第三维数值。
      en: 'ECharts 6+ matrix coordinates: three columns by two rows, with six fictional scatter points colored
        by the third dimension.'
    web:
      zh-Hans: 线上
      en: Web
    store:
      zh-Hans: 门店
      en: Store

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_matrix
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - matrix
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    matrix:
      x:
        data:
        - A
        - B
        - C
      y:
        data:
        - {i18n: web}
        - {i18n: store}
      left: 55
      right: 20
      top: 25
      bottom: 55
    visualMap:
      min: 0
      max: 6
      dimension: 2
      orient: horizontal
      left: center
      bottom: 0
    series:
    - id: series_1
      type: scatter
      coordinateSystem: matrix
      symbolSize: 28
      data:
      - - 0
        - 0
        - 2
      - - 1
        - 0
        - 5
      - - 2
        - 0
        - 3
      - - 0
        - 1
        - 4
      - - 1
        - 1
        - 1
      - - 2
        - 1
        - 6
