params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_sunburst
  title: ECharts · 旭日图
  tags:
  - 图表原型
  - ECharts
  - sunburst
  notes: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - type: sunburst
      data:
      - name: Products
        children:
        - name: Tools
          value: 12
        - name: Books
          value: 8
      - name: Services
        children:
        - name: Design
          value: 9
        - name: Support
          value: 6
      radius:
      - 0
      - 80%
      label:
        rotate: radial
        fontSize: 11
