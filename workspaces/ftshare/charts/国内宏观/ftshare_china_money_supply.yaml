params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-money-supply
    format: json
    recordsPath:
    - data
    - items
    params:
      page: 1
      page_size: '{{ params.periods }}'
dataset:
  id: money_supply_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(m0_yoy AS DOUBLE) AS m0_yoy,
             TRY_CAST(m1_yoy AS DOUBLE) AS m1_yoy,
             TRY_CAST(m2_yoy AS DOUBLE) AS m2_yoy
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  tags: ["国内宏观", "货币", "金融", "M2"]
  id: ftshare_china_money_supply
  title: 货币供应 · M0/M1/M2 同比
  dataset: money_supply_data
  renderer: echarts
  notes: |-
    比较 M0、M1、M2 的同比增长，观察不同货币口径的变化。单位：%。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/twl6t7h1
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: money_supply_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: M0
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: money_supply_data
        field: m0_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: M1
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: money_supply_data
        field: m1_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: M2
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: money_supply_data
        field: m2_yoy
      symbolSize: 4
      showAllSymbol: auto
