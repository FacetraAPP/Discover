i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 树图
      en: ECharts · Tree
    notes:
      zh-Hans: '查看虚构产品与服务及其子类别的层级关系，可离线查看。'
      en: 'Explore the hierarchy of fictional products, services and their subcategories offline.'
    root:
      zh-Hans: 根节点
      en: Root
    products:
      zh-Hans: 产品
      en: Products
    tools:
      zh-Hans: 工具
      en: Tools
    books:
      zh-Hans: 书籍
      en: Books
    services:
      zh-Hans: 服务
      en: Services
    design:
      zh-Hans: 设计
      en: Design
    support:
      zh-Hans: 支持
      en: Support

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_tree
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - tree
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: tree
      data:
      - name: {i18n: root}
        children:
        - name: {i18n: products}
          children:
          - name: {i18n: tools}
            value: 12
          - name: {i18n: books}
            value: 8
        - name: {i18n: services}
          children:
          - name: {i18n: design}
            value: 9
          - name: {i18n: support}
            value: 6
      left: 15%
      right: 24%
      top: 12%
      bottom: 12%
      symbolSize: 12
      initialTreeDepth: -1
      label:
        position: left
        fontSize: 11
      leaves:
        label:
          position: right
          fontSize: 11
      expandAndCollapse: false
