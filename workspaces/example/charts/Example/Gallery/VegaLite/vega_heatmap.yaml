i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Product revenue by month
      zh-Hans: Vega-Lite · 产品月度收入热力图
    notes:
      en: 'Compare monthly revenue by product through color intensity. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '通过颜色深浅比较各产品每月的收入。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_heatmap
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: rect
      tooltip: true
    encoding:
      x:
        field: month
        type: temporal
        timeUnit: yearmonth
      y:
        field: product
        type: nominal
      color:
        aggregate: sum
        field: revenue
        type: quantitative
        title: Revenue (demo units)
