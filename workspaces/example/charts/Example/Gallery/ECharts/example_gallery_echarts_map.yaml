i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 离线地图
      en: ECharts · Offline map
    notes:
      zh-Hans: '两个虚构岛屿的 GeoJSON 内嵌在 chart.option.series.data 的表达式中，通过 registerMap 离线注册；不代表真实地理区域。 layoutCenter/layoutSize
        与 aspectScale: 1 保持虚构平面坐标的等比例形状。'
      en: 'GeoJSON for two fictional islands is embedded in the chart.option.series.data expression and registered
        offline with registerMap; it does not represent real places. layoutCenter/layoutSize and aspectScale:
        1 preserve equal scale in the fictional planar coordinates.'

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_map
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - map
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    visualMap:
      min: 0
      max: 20
      orient: horizontal
      left: center
      bottom: 0
    series:
    - id: series_1
      type: map
      map: gallery-islands
      roam: false
      label:
        show: true
      data: 'js: (() => { echarts.registerMap("gallery-islands", {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"West"},"geometry":{"type":"Polygon","coordinates":[[[0,0],[2,0],[2,2],[0,2],[0,0]]]}},{"type":"Feature","properties":{"name":"East"},"geometry":{"type":"Polygon","coordinates":[[[3,0],[5,0],[5,2],[3,2],[3,0]]]}}]});
        return [{name:"West",value:8},{name:"East",value:16}]; })()'
      aspectScale: 1
      layoutCenter:
      - 50%
      - 44%
      layoutSize: 90%
