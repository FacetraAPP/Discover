i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 平行坐标
      en: ECharts · Parallel coordinates
    notes:
      zh-Hans: '从速度、成本与质量三个维度比较三组虚构样本，各维度的演示刻度为 0–10。可离线查看。'
      en: 'Compare three fictional samples across speed, cost and quality, each on a demonstration scale of 0–10. Works offline.'
    speed:
      zh-Hans: 速度
      en: Speed
    cost:
      zh-Hans: 成本
      en: Cost
    quality:
      zh-Hans: 质量
      en: Quality

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_parallel
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - parallel
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    parallel:
      left: 12%
      right: 12%
      top: 18%
      bottom: 15%
    parallelAxis:
    - dim: 0
      name: {i18n: speed}
      min: 0
      max: 10
    - dim: 1
      name: {i18n: cost}
      min: 0
      max: 10
    - dim: 2
      name: {i18n: quality}
      min: 0
      max: 10
    series:
    - id: series_1
      type: parallel
      lineStyle:
        width: 3
      data:
      - - 2
        - 8
        - 6
      - - 5
        - 3
        - 9
      - - 8
        - 6
        - 4
