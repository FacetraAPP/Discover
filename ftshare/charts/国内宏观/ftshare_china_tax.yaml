params:
- name: periods
  label: 显示期数（月）
  type: integer
  default: 60
  minimum: 1
  maximum: 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-tax-revenue
    format: json
    recordsPath:
    - data
dataset:
  id: tax_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(monthly_yoy_growth AS DOUBLE) AS monthly_yoy_growth,
             TRY_CAST(yoy_growth AS DOUBLE) AS yoy_growth
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_tax
  title: 税收收入 · 同比
  dataset: tax_data
  renderer: echarts
  notes: |-
    FTShare 国内宏观：税收收入 · 同比。单位：%。当月同比由服务端计算，累计同比来自 yoy_growth。展示最近指定期数，按时间升序排列；缺失值保留为 null。 文档：https://market.ft.tech/gateway/doc/p/ht6ox0mg
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2)'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 16
      top: 56
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: tax_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 当月同比（计算值）
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: tax_data
        field: monthly_yoy_growth
    - name: 累计同比
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: tax_data
        field: yoy_growth
