params:
- name: periods
  label: 显示期数（季）
  type: integer
  default: 20
  minimum: 1
  maximum: 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-gdp
    format: json
    recordsPath:
    - data
dataset:
  id: gdp_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(period, '([0-9]{4})年', 1) || '-Q' || regexp_extract(period, '([1-4])季度', 1) AS period,
             TRY_CAST(gdp_yoy AS DOUBLE) AS gdp_yoy,
             TRY_CAST(primary_cumulative_yoy AS DOUBLE) AS primary_cumulative_yoy,
             TRY_CAST(secondary_cumulative_yoy AS DOUBLE) AS secondary_cumulative_yoy,
             TRY_CAST(tertiary_cumulative_yoy AS DOUBLE) AS tertiary_cumulative_yoy
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_gdp
  title: GDP · 累计同比
  dataset: gdp_data
  renderer: echarts
  notes: |-
    FTShare 国内宏观：GDP · 累计同比。单位：%。季度标签为年初至该季度的累计口径，不代表单季度增速。展示最近指定期数，按时间升序排列；缺失值保留为 null。 文档：https://market.ft.tech/gateway/doc/p/egodfcdg
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2)'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 16
      top: 56
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: gdp_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: GDP
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: gdp_data
        field: gdp_yoy
    - name: 第一产业
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: gdp_data
        field: primary_cumulative_yoy
    - name: 第二产业
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: gdp_data
        field: secondary_cumulative_yoy
    - name: 第三产业
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: gdp_data
        field: tertiary_cumulative_yoy
