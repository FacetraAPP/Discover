i18n:
  defaultLocale: zh-Hans
  messages:
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    title:
      zh-Hans: 月度均价
      en: Monthly average price
    notes:
      zh-Hans: DuckDB SQL 关联两个 CSV，按月聚合。
      en: DuckDB SQL joins two CSV files and aggregates by month.
params:
- name: symbol
  label:
    i18n: symbol
  type: string
  required: true
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
  advanced: false
  default: 600519.SH
sources: {}
dataset:
  id: monthly
  sources:
  - id: prices
    ref: example_price.yaml#/sources/prices
    with:
      symbol:
        param: symbol
  - id: symbols
    ref: example_price.yaml#/sources/symbols
  sql: "SELECT strftime(CAST(p.trade_date AS DATE), '%Y-%m') AS month,\n       s.name\
    \ AS symbol_name,\n       AVG(CAST(p.close AS DOUBLE)) AS average_close,\n   \
    \    COUNT(*) AS trading_days,\n       CAST(SUM(CAST(p.volume AS BIGINT)) AS BIGINT)\
    \ AS volume\nFROM prices p LEFT JOIN symbols s ON p.symbol = s.symbol\nWHERE p.symbol\
    \ = $symbol\nGROUP BY month, s.name\nORDER BY month"
metadata:
  tags:
  - 股票
  - 月度
  - 聚合
  id: example_monthly
  title:
    i18n: title
  notes:
    i18n: notes
chart:
  dataset: monthly
  renderer: echarts
  option:
    tooltip:
      trigger: axis
    grid:
      left: 12
      right: 18
      top: 24
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      data:
        from: monthly
        field: month
    yAxis:
      type: value
      scale: true
    series:
    - type: bar
      data:
        from: monthly
        field: average_close
