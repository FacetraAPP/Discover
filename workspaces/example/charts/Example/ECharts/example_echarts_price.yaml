i18n:
  defaultLocale: zh-Hans
  messages:
    symbol:
      zh-Hans: 股票代码
      en: Stock symbol
    trading_days:
      zh-Hans: 交易日数
      en: Trading days
    ma_window:
      zh-Hans: 均线窗口
      en: MA window
    title:
      zh-Hans: ECharts · 股价与均线
      en: ECharts · Share price and moving average
    notes:
      zh-Hans: '比较虚构股价与均线，价格采用演示单位。历史不足以计算均线的区间留空。点击图例切换曲线，缩放或轻触查看数值。'
      en: 'Compare fictional share prices and a moving average in demonstration price units. The moving average remains blank until enough history is available. Toggle lines in the legend, zoom, or tap to inspect values.'
    close:
      zh-Hans: 收盘价
      en: Close
    moving_average:
      zh-Hans: 移动均线
      en: Moving average

params:
- name: symbol
  label: {i18n: symbol}
  type: string
  required: true
  options:
  - 600519.SH
  - 300750.SZ
  - 000001.SZ
  advanced: false
  default: 600519.SH
- name: days
  label: {i18n: trading_days}
  type: integer
  required: true
  minimum: 1e+0
  maximum: 1.8e+2
  advanced: false
  default: 60
- name: ma_window
  label: {i18n: ma_window}
  type: integer
  required: true
  minimum: 2e+0
  maximum: 6e+1
  advanced: false
  default: 20
sources: {}
dataset:
  id: history
  ref: example_price.yaml#/dataset
  with:
    ma_window:
      param: ma_window
    days:
      param: days
    symbol:
      param: symbol
metadata:
  tags: ["股票", "行情", "均线", "ECharts"]
  id: example_echarts_price
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: history
  renderer: echarts
  option:
    media:
    - query:
        maxWidth: 480
      option:
        yAxis:
          splitNumber: 3
        grid:
          bottom: 20
          left: 8
          top: 36
          right: 12
          containLabel: true
    - option:
        yAxis:
          splitNumber: 2
        grid:
          bottom: 18
          top: 8
        legend:
          show: false
      query:
        maxHeight: 190
    color:
    - '#3b82f6'
    - '#f59e0b'
    dataZoom:
    - type: inside
      zoomOnMouseWheel: ctrl
    - show: false
      bottom: 4
      type: slider
      height: 20
    grid:
      top: 40
      right: 18
      containLabel: true
      bottom: 24
      left: 12
    series:
    - id: series_1
      showSymbol: false
      areaStyle:
        opacity: 8e-2
      data:
        x: trade_date
        from: history
        y: close
      type: line
      name: {i18n: close}
    - id: series_2
      lineStyle:
        type: dashed
      type: line
      name: {i18n: moving_average}
      showSymbol: false
      data:
        x: trade_date
        y: ma
        from: history
      connectNulls: false
    xAxis:
      type: time
      boundaryGap: false
    tooltip:
      trigger: axis
      valueFormatter:
        from: script
        name: price
    legend:
      top: 4
    yAxis:
      type: value
      scale: true
  scripts:
    price: '(value) => value == null ? ''—'' : ''¥'' + Number(value).toFixed(2)'
