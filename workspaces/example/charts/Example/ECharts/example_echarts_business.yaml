i18n:
  defaultLocale: zh-Hans
  messages:
    months:
      zh-Hans: 月数
      en: Months
    revenue_target:
      zh-Hans: 收入目标
      en: Revenue target
    show_labels:
      zh-Hans: 显示标签
      en: Show labels
    title:
      zh-Hans: ECharts · 收入与利润率
      en: ECharts · Revenue and profit margin
    notes:
      zh-Hans: '12 个月的虚构经营数据，金额单位为万元。柱状图堆叠线上与门店收入，右轴显示利润率。

        months 由 SQL 控制；target 绑定目标线；show_labels 直接绑定 ECharts 的 label.show。'
      en: 'Twelve months of fictional business data, in units of CNY 10,000. Bars
        stack online and store revenue; the right axis shows profit margin.

        SQL controls months; target sets the target line; show_labels binds directly
        to ECharts label.show.'
    target:
      zh-Hans: 目标
      en: Target
    online:
      zh-Hans: 线上
      en: Online
    store:
      zh-Hans: 门店
      en: Store
    margin:
      zh-Hans: 利润率
      en: Profit margin
    amount_unit:
      zh-Hans: 万元
      en: CNY 10,000
params:
- name: months
  label:
    i18n: months
  type: integer
  default: 12
  minimum: 3
  maximum: 12
- name: target
  label:
    i18n: revenue_target
  type: number
  default: 170
  minimum: 0
  maximum: 400
- name: show_labels
  label:
    i18n: show_labels
  type: boolean
  default: false
sources:
  sales:
    source: duckdb
    file: data/example/echarts-sales.csv
dataset:
  id: sales
  sources:
  - id: raw
    ref: '#/sources/sales'
  sql: "WITH recent AS (\n  SELECT month, CAST(online AS DOUBLE) AS online, CAST(retail\
    \ AS DOUBLE) AS retail,\n         CAST(cost AS DOUBLE) AS cost\n  FROM raw ORDER\
    \ BY month DESC LIMIT $months\n)\nSELECT month, online, retail, online + retail\
    \ - cost AS profit,\n       round(100 * (online + retail - cost) / (online + retail),\
    \ 1) AS margin\nFROM recent ORDER BY month\n"
metadata:
  tags:
  - 经营
  - 收入
  - 利润率
  - ECharts
  id: example_echarts_business
  title:
    i18n: title
  notes:
    i18n: notes
chart:
  dataset: sales
  renderer: echarts
  option:
    color:
    - '#3b82f6'
    - '#14b8a6'
    - '#f59e0b'
    legend:
      top: 4
    tooltip:
      trigger: axis
    grid:
      left: 10
      right: 10
      top: 48
      bottom: 16
      containLabel: true
    xAxis:
      type: category
      data:
        from: sales
        field: month
      axisLabel:
        formatter: 'js: (v) => v.slice(5)'
    yAxis:
    - type: value
      name:
        i18n: amount_unit
    - type: value
      name:
        i18n: margin
      axisLabel:
        formatter: '{value}%'
    series:
    - name:
        i18n: online
      type: bar
      stack: revenue
      data:
        from: sales
        field: online
      label:
        show:
          from: params
          name: show_labels
      markLine:
        symbol: none
        label:
          formatter:
            i18n: target
        data:
        - yAxis:
            from: params
            name: target
    - name:
        i18n: store
      type: bar
      stack: revenue
      data:
        from: sales
        field: retail
      label:
        show:
          from: params
          name: show_labels
    - name:
        i18n: margin
      type: line
      yAxisIndex: 1
      data:
        from: sales
        field: margin
      smooth: true
      tooltip:
        valueFormatter: 'js: (v) => Number(v).toFixed(1) + ''%'''
    media:
    - query:
        maxWidth: 480
      option:
        legend:
          type: scroll
          top: 0
        grid:
          left: 6
          right: 6
          top: 44
          bottom: 12
          containLabel: true
        xAxis:
          axisLabel:
            interval: 1
        yAxis:
        - splitNumber: 3
        - splitNumber: 3
    - query:
        maxHeight: 190
      option:
        legend:
          show: false
        grid:
          top: 8
          bottom: 16
        xAxis:
          axisLabel:
            interval: 3
        yAxis:
        - name: ''
          splitNumber: 2
        - name: ''
          splitNumber: 2
