i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 关系图
      en: ECharts · Graph
    notes:
      zh-Hans: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
      en: Structured fictional samples are embedded directly in chart.option, with a shared four-row CSV as
        the executable dataset. No network, parameters or connections are required.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_graph
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - graph
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: graph
      layout: circular
      roam: false
      symbolSize: 40
      label:
        show: true
      edgeSymbol:
      - none
      - arrow
      edgeSymbolSize: 8
      lineStyle:
        width: 2
        curveness: 0.1
      data:
      - name: A
      - name: B
      - name: C
      - name: D
      links:
      - source: A
        target: B
        value: 5
      - source: A
        target: C
        value: 3
      - source: B
        target: D
        value: 5
      - source: C
        target: D
        value: 3
