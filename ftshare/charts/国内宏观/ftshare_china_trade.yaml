params:
- name: periods
  label: 显示期数（月）
  type: integer
  default: 60
  minimum: 1
  maximum: 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-customs-trade
    format: json
    recordsPath:
    - data
dataset:
  id: trade_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(export_yoy AS DOUBLE) AS export_yoy,
             TRY_CAST(import_yoy AS DOUBLE) AS import_yoy
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_trade
  title: 进出口 · 同比
  dataset: trade_data
  renderer: echarts
  notes: |-
    FTShare 国内宏观：进出口 · 同比。单位：%。展示最近指定期数，按时间升序排列；缺失值保留为 null。 文档：https://market.ft.tech/gateway/doc/p/n6bu5izh
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2)'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 16
      top: 56
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: trade_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 出口
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: trade_data
        field: export_yoy
    - name: 进口
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: trade_data
        field: import_yoy
