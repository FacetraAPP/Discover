i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Swift Charts · 散点 · PointMark
      en: Swift Charts · Scatter · PointMark
    notes:
      zh-Hans: 5 个虚构坐标。X 为真实数值轴，间距 1、2、3、2 不会按行号等距绘制。
      en: Five fictional coordinates on a true numeric X axis. Gaps of 1, 2, 3 and 2 retain their spacing instead
        of being equally spaced by row.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-scatter.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT CAST(x AS DOUBLE) AS x, CAST(y AS DOUBLE) AS y FROM raw ORDER BY x
metadata:
  id: example_gallery_swift_scatter
  title: {i18n: title}
  tags:
  - 图表原型
  - Swift Charts
  - scatter
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: default
  plot: scatter
  x: x
  y: y
