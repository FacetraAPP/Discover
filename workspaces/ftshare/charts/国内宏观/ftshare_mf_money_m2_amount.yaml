i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 广义货币M2 · 存量规模
      en: Broad money M2 · Stock
    notes:
      zh-Hans: |-
        观察广义货币M2的期末存量，单位人民币万亿元；仅纳入响应明确标为人民币亿元的记录并换算。M2是存量而非本月新增货币，不能把月度存量相加。默认最近24个观测期；名义规模上升不直接等于通胀或股票资金流入。

        缺失值保留空白；观察期内无记录的日期不补点。数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/twl6t7h1
      en: |-
        Track the end-period stock of broad money M2 in trillion CNY, converting only records explicitly labeled CNY/100 million yuan. M2 is a stock, not monthly money creation; monthly balances must not be added. Defaults to 24 observations. Nominal expansion does not directly measure inflation or equity inflows.

        Missing values remain empty; dates without observations are not filled. Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/twl6t7h1
    param.periods:
      zh-Hans: 最近期数
      en: Recent observations
    series.amount:
      zh-Hans: M2（万亿元）
      en: M2 (trillion CNY)
metadata:
  id: ftshare_mf_money_m2_amount
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - 国内宏观
  - 货币供应
params:
- name: periods
  label:
    i18n: param.periods
  type: integer
  default: 24
  options:
  - 12
  - 24
  - 48
  - 96
sources:
  remote:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-money-supply
    headers:
      FTSHARE_API_KEY: '{{ connections.ftshare.api_key | default('''') }}'
      Content-Type: application/json
    format: json
    recordsPath:
    - data
    - items
    params:
      page: 1
      page_size: 200
dataset:
  id: analysis
  sources:
  - id: raw
    ref: '#/sources/remote'
  sql: WITH n AS (SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月',
    1), 2, '0') || '-01' AS period,TRY_CAST(m2_current AS DOUBLE)/10000 AS amount FROM raw WHERE unit='亿元' AND currency='人民币')
    SELECT * FROM (SELECT * FROM n ORDER BY period DESC LIMIT $periods) r ORDER BY period
chart:
  dataset: analysis
  renderer: echarts
  option:
    tooltip:
      trigger: axis
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 58
      bottom: 30
      containLabel: true
    xAxis:
      type: time
      boundaryGap: false
    yAxis:
      type: value
      name: trillion CNY
      scale: true
    series:
    - id: amount
      name:
        i18n: series.amount
      type: line
      data:
        from: analysis
        x: period
        y: amount
      showSymbol: true
      symbolSize: 4
      connectNulls: false
