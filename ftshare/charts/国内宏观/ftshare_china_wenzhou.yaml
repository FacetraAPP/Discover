params:
- name: start_date
  label: 开始日期
  type: date
  default: '2026-08-01'
- name: end_date
  label: 结束日期
  type: date
  default: '2026-08-31'
- name: page
  label: 页码
  type: integer
  default: 1
  minimum: 1
  advanced: true
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/wz-index-daily
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date | date_format(''yyyyMMdd'') }}'
      end_date: '{{ params.end_date | date_format(''yyyyMMdd'') }}'
      page: '{{ params.page }}'
      page_size: 1000
dataset:
  id: wenzhou_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT CAST(date AS VARCHAR) AS period,
             TRY_CAST(comp_rate AS DOUBLE) AS comp_rate,
             TRY_CAST(center_rate AS DOUBLE) AS center_rate,
             TRY_CAST(micro_rate AS DOUBLE) AS micro_rate,
             TRY_CAST(sdb_rate AS DOUBLE) AS sdb_rate
      FROM raw
    )
    SELECT * FROM normalized WHERE period <> '' ORDER BY period
chart:
  id: ftshare_china_wenzhou
  title: 温州民间融资 · 综合与分项利率
  dataset: wenzhou_data
  renderer: echarts
  notes: |-
    比较温州民间融资综合利率与三类机构的分项利率。缩放纵轴用于观察细小变化。单位：%。

    默认查看 2026 年 8 月。日期使用日历选择，按真实日历时间排列；周末和缺报不补点。高级参数可切换页码，每页最多 1000 条。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/e4w9tgm2
  option:
    tooltip:
      trigger: axis
      formatter: 'js:(items) => { const rows = Array.isArray(items) ? items : [items]; if (!rows.length) return ''''; const d = new Date(rows[0].axisValue); const date = d.getFullYear() + ''-'' + String(d.getMonth() + 1).padStart(2, ''0'') + ''-'' + String(d.getDate()).padStart(2, ''0''); return date + ''<br/>'' + rows.map(p => p.marker + p.seriesName + '': '' + (p.value[1] == null ? ''—'' : Number(p.value[1]).toFixed(4) + ''%'')).join(''<br/>''); }'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: time
      boundaryGap: false
      axisLabel:
        formatter: '{MM}-{dd}'
      min: dataMin
      max: dataMax
    yAxis:
      type: value
      name: '%'
      scale: true
      min: js:(e) => Math.floor((e.min - 0.05) * 100) / 100
      max: js:(e) => Math.ceil((e.max + 0.05) * 100) / 100
      axisLabel:
        formatter: js:(value) => Number(value).toFixed(2)
    series:
    - name: 综合利率
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: wenzhou_data
        x: period
        y: comp_rate
      symbolSize: 4
      showAllSymbol: auto
    - name: 借贷服务中心
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: wenzhou_data
        x: period
        y: center_rate
      symbolSize: 4
      showAllSymbol: auto
    - name: 小额贷款公司
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: wenzhou_data
        x: period
        y: micro_rate
      symbolSize: 4
      showAllSymbol: auto
    - name: 民间资本管理公司
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: wenzhou_data
        x: period
        y: sdb_rate
      symbolSize: 4
      showAllSymbol: auto
