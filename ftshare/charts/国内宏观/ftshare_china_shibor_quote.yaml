params:
- name: start_date
  label: 开始日期（YYYYMMDD）
  type: string
  default: '20260801'
- name: end_date
  label: 结束日期（YYYYMMDD）
  type: string
  default: '20260831'
- name: page
  label: 页码
  type: integer
  default: 1
  minimum: 1
  advanced: true
- name: bank
  label: 报价行（精确名称）
  type: string
  default: 中国银行
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/shibor-quote-daily
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date }}'
      end_date: '{{ params.end_date }}'
      page: '{{ params.page }}'
      page_size: 1000
      bank: '{{ params.bank }}'
dataset:
  id: shibor_quote_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT CAST(trade_date AS VARCHAR) AS period,
             TRY_CAST(on_rate AS DOUBLE) AS on_rate,
             TRY_CAST(w1 AS DOUBLE) AS w1,
             TRY_CAST(m3 AS DOUBLE) AS m3,
             TRY_CAST(y1 AS DOUBLE) AS y1
      FROM raw
    )
    SELECT * FROM normalized WHERE period <> '' ORDER BY period
chart:
  id: ftshare_china_shibor_quote
  title: SHIBOR · 报价行利率
  dataset: shibor_quote_data
  renderer: echarts
  notes: |-
    FTShare 国内宏观：SHIBOR · 报价行利率。单位：%。默认查询 2026 年 8 月；可调整日期和页码，每页最多 1000 条。缺报和非交易日不填充。 文档：https://market.ft.tech/gateway/doc/p/optr82sd
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2)'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 16
      top: 56
      bottom: 24
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: shibor_quote_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 隔夜
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: shibor_quote_data
        field: on_rate
    - name: 1 周
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: shibor_quote_data
        field: w1
    - name: 3 月
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: shibor_quote_data
        field: m3
    - name: 1 年
      type: line
      showSymbol: false
      connectNulls: false
      data:
        from: shibor_quote_data
        field: y1
