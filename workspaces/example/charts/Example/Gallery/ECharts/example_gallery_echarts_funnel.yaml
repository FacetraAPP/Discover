i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 漏斗
      en: ECharts · Funnel
    notes:
      zh-Hans: 结构化虚构样本直接内嵌 chart.option；共享 4 行 CSV 作为可执行 dataset。无需网络、参数或连接。
      en: Structured fictional samples are embedded directly in chart.option, with a shared four-row CSV as
        the executable dataset. No network, parameters or connections are required.
    visit:
      zh-Hans: 访问
      en: Visits
    browse:
      zh-Hans: 浏览
      en: Browsing
    cart:
      zh-Hans: 购物车
      en: Cart
    buy:
      zh-Hans: 购买
      en: Purchases

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_funnel
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - funnel
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: funnel
      left: 12%
      width: 76%
      top: 10%
      bottom: 10%
      min: 0
      max: 100
      sort: descending
      gap: 4
      label:
        position: inside
        formatter: '{b}: {c}'
      data:
      - name: {i18n: visit}
        value: 100
      - name: {i18n: browse}
        value: 70
      - name: {i18n: cart}
        value: 40
      - name: {i18n: buy}
        value: 20
