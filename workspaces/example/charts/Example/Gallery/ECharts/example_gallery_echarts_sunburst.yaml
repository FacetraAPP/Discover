i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 旭日图
      en: ECharts · Sunburst
    notes:
      zh-Hans: '查看虚构产品与服务的层级占比，扇区大小表示演示数值。可离线查看。'
      en: 'Explore the hierarchical shares of fictional products and services. Sector size represents demonstration values. Works offline.'
    products:
      zh-Hans: 产品
      en: Products
    tools:
      zh-Hans: 工具
      en: Tools
    books:
      zh-Hans: 书籍
      en: Books
    services:
      zh-Hans: 服务
      en: Services
    design:
      zh-Hans: 设计
      en: Design
    support:
      zh-Hans: 支持
      en: Support

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_sunburst
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - sunburst
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: sunburst
      data:
      - name: {i18n: products}
        children:
        - name: {i18n: tools}
          value: 12
        - name: {i18n: books}
          value: 8
      - name: {i18n: services}
        children:
        - name: {i18n: design}
          value: 9
        - name: {i18n: support}
          value: 6
      radius:
      - 0
      - 80%
      label:
        rotate: radial
        fontSize: 11
