i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: SHIBOR · 期限比较
      en: SHIBOR · Maturity comparison
    notes:
      zh-Hans: |-
        比较 SHIBOR 隔夜、1 周、3 月和 1 年利率。缩放纵轴用于观察细小变化。单位：%。

        默认查看 2026 年 8 月。日期使用日历选择，按真实日历时间排列；周末和缺报不补点。高级参数可切换页码，每页最多 1000 条。
        数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/3jnxyzmy
      en: |-
        Compare overnight, one-week, three-month and one-year SHIBOR rates. The scaled vertical axis highlights small changes. Unit: %.

        The default window is August 2026. Choose dates with the calendar; the time axis preserves actual dates. Weekends and missing reports are not filled. The advanced page parameter selects one page of up to 1,000 records.
        Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/3jnxyzmy

params:
- name: start_date
  label: 开始日期
  type: date
  default: '2026-08-01'
- name: end_date
  label: 结束日期
  type: date
  default: '2026-08-31'
- name: page
  label: 页码
  type: integer
  default: 1
  minimum: 1
  advanced: true
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/shibor-daily
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date | date_format(''yyyyMMdd'') }}'
      end_date: '{{ params.end_date | date_format(''yyyyMMdd'') }}'
      page: '{{ params.page }}'
      page_size: 1000
dataset:
  id: shibor_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT CAST(trade_date AS VARCHAR) AS period,
             TRY_CAST(on_rate AS DOUBLE) AS on_rate,
             TRY_CAST(w1 AS DOUBLE) AS w1,
             TRY_CAST(m3 AS DOUBLE) AS m3,
             TRY_CAST(y1 AS DOUBLE) AS y1
      FROM raw
    )
    SELECT * FROM normalized WHERE period <> '' ORDER BY period
metadata:
  tags: ["国内宏观", "利率", "货币市场", "SHIBOR"]
  id: ftshare_china_shibor
  title: {i18n: title}
  notes: {i18n: notes}
chart:
  dataset: shibor_data
  renderer: echarts
  option:
    tooltip:
      trigger: axis
      formatter: 'js:(items) => { const rows = Array.isArray(items) ? items : [items]; if (!rows.length) return ''''; const d = new Date(rows[0].axisValue); const date = d.getFullYear() + ''-'' + String(d.getMonth() + 1).padStart(2, ''0'') + ''-'' + String(d.getDate()).padStart(2, ''0''); return date + ''<br/>'' + rows.map(p => p.marker + p.seriesName + '': '' + (p.value[1] == null ? ''—'' : Number(p.value[1]).toFixed(4) + ''%'')).join(''<br/>''); }'
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: time
      boundaryGap: false
      axisLabel:
        formatter: '{MM}-{dd}'
      min: dataMin
      max: dataMax
    yAxis:
      type: value
      name: '%'
      scale: true
      min: js:(e) => Math.floor((e.min - 0.05) * 100) / 100
      max: js:(e) => Math.ceil((e.max + 0.05) * 100) / 100
      axisLabel:
        formatter: js:(value) => Number(value).toFixed(2)
    series:
    - name: 隔夜
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: shibor_data
        x: period
        y: on_rate
      symbolSize: 4
      showAllSymbol: auto
    - name: 1 周
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: shibor_data
        x: period
        y: w1
      symbolSize: 4
      showAllSymbol: auto
    - name: 3 月
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: shibor_data
        x: period
        y: m3
      symbolSize: 4
      showAllSymbol: auto
    - name: 1 年
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: shibor_data
        x: period
        y: y1
      symbolSize: 4
      showAllSymbol: auto
