i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Revenue distribution
      zh-Hans: Vega-Lite · 收入分布
    notes:
      en: 'Explore the distribution of revenue values. Bar height counts records in each range. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '查看收入数值的分布，柱高表示落在各数值区间的记录数。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_histogram
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: bar
      tooltip: true
    encoding:
      x:
        bin: true
        field: revenue
        type: quantitative
        title: Revenue (demo units)
      y:
        aggregate: count
        type: quantitative
        title: Records
