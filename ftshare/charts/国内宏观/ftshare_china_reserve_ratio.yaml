params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-reserve-ratio
    format: json
    recordsPath:
    - data
dataset:
  id: reserve_ratio_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(date, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(date, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(reserve_ratio_small_medium AS DOUBLE) AS reserve_ratio_small_medium,
             TRY_CAST(reserve_ratio_large AS DOUBLE) AS reserve_ratio_large
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_reserve_ratio
  title: 存款准备金率
  dataset: reserve_ratio_data
  renderer: echarts
  notes: |-
    比较大型与中小型金融机构的存款准备金率，观察政策调整。单位：%。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/cl9tjf4p
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: reserve_ratio_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: true
      min: js:(e) => Math.floor((e.min - 0.05) * 100) / 100
      max: js:(e) => Math.ceil((e.max + 0.05) * 100) / 100
      axisLabel:
        formatter: js:(value) => Number(value).toFixed(2)
    series:
    - name: 中小型金融机构
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: reserve_ratio_data
        field: reserve_ratio_small_medium
      step: end
      symbolSize: 4
      showAllSymbol: auto
    - name: 大型金融机构
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: reserve_ratio_data
        field: reserve_ratio_large
      step: end
      symbolSize: 4
      showAllSymbol: auto
