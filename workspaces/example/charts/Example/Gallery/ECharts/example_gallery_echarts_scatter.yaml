i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 散点
      en: ECharts · Scatter
    notes:
      zh-Hans: 离线虚构数据，数值为演示单位；无需参数或连接。
      en: Fictional offline data in demonstration units. No parameters or connections are required.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-scatter.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_scatter
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - scatter
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    xAxis:
      type: value
      min: 0
    yAxis:
      type: value
      min: 0
    series:
    - id: series_1
      type: scatter
      symbolSize: 14
      data:
        from: sample
        fields:
        - x
        - y
