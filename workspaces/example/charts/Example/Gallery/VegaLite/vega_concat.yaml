i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Revenue and profit comparison
      zh-Hans: Vega-Lite · 收入与利润组合
    notes:
      en: 'View monthly revenue and profit trends together. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '对照查看每月收入与利润的变化。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_concat
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    vconcat:
    - width: 220
      height: 100
      mark: bar
      encoding:
        x: &id001
          field: month
          type: temporal
          timeUnit: yearmonth
          axis:
            format: '%b'
            labelOverlap: true
          title: Month
        y:
          aggregate: sum
          field: revenue
          type: quantitative
          title: Revenue (demo units)
    - width: 220
      height: 100
      mark: line
      encoding:
        x: *id001
        y:
          aggregate: sum
          field: profit
          type: quantitative
          title: Profit (demo units)
