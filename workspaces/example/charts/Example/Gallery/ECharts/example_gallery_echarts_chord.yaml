i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 弦图
      en: ECharts · Chord
    notes:
      zh-Hans: ECharts 6+ 弦图：3 个虚构节点与 3 条带权重的连接，宽度表达流量。
      en: ECharts 6+ chord chart with three fictional nodes and three weighted links. Link width represents
        flow.

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_chord
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - chord
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: chord
      radius:
      - 65%
      - 72%
      label:
        show: true
      data:
      - name: A
      - name: B
      - name: C
      links:
      - source: A
        target: B
        value: 5
      - source: B
        target: C
        value: 3
      - source: C
        target: A
        value: 2
