params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: 'SELECT label AS name, CAST(value AS DOUBLE) AS value FROM raw ORDER BY label

    '
metadata:
  id: example_gallery_echarts_doughnut
  title: ECharts · 环形
  tags:
  - 图表原型
  - ECharts
  - doughnut
  notes: 离线虚构数据，数值为演示单位；无需参数或连接。
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - type: pie
      radius:
      - 35%
      - 55%
      center:
      - 50%
      - 45%
      label:
        formatter: '{b}: {c}'
        alignTo: edge
        edgeDistance: 8
        bleedMargin: 4
        distanceToLabelLine: 4
      data:
        from: sample
        rows: true
      labelLine:
        length: 8
        length2: 8
