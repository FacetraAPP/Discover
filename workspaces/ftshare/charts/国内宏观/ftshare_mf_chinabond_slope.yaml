i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: 中债收益率 · 长短端利差
      en: ChinaBond yields · Term spread
    notes:
      zh-Hans: |-
        以10年收益率减1年收益率衡量同一曲线的期限斜率，单位基点（1个百分点=100基点）。正数为长端更高、负数为倒挂；利差不能单独解释为预期短期利率，仍含期限及信用溢价。默认国债曲线、2026-08-01至2026-10-21，单页最多1000行。只在同一天两端均有报价时计算。

        缺失值保留空白；观察期内无记录的日期不补点。数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/fubopatp
      en: |-
        Measure the slope of one yield curve as the 10-year yield minus the 1-year yield, in basis points (1 percentage point = 100 bp). Positive values slope upward and negatives indicate inversion. The spread also reflects term and credit premia, not just expected short rates. Default: sovereign curve, 2026-08-01 to 2026-10-21, at most 1,000 rows. Both maturities must be present on the same date.

        Missing values remain empty; dates without observations are not filled. Source: FTShare. Documentation: https://market.ft.tech/gateway/doc/p/fubopatp
    param.start_date:
      zh-Hans: 开始日期
      en: Start date
    param.end_date:
      zh-Hans: 结束日期
      en: End date
    param.curve_name:
      zh-Hans: 收益率曲线
      en: Yield curve
    series.spread:
      zh-Hans: 10年−1年（基点）
      en: 10y−1y (bp)
metadata:
  id: ftshare_mf_chinabond_slope
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - 国内宏观
  - 中债收益率曲线日度
params:
- name: start_date
  label:
    i18n: param.start_date
  type: date
  default: '2026-08-01'
- name: end_date
  label:
    i18n: param.end_date
  type: date
  default: '2026-10-21'
- name: curve_name
  label:
    i18n: param.curve_name
  type: string
  default: 中债国债收益率曲线
  options:
  - 中债国债收益率曲线
  - 中债中短期票据收益率曲线(AAA)
  - 中债商业银行普通债收益率曲线(AAA)
sources:
  remote:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/chinabond-yield-daily
    headers:
      FTSHARE_API_KEY: '{{ connections.ftshare.api_key | default('''') }}'
      Content-Type: application/json
    format: json
    recordsPath:
    - data
    - records
    params:
      start_date: '{{ params.start_date | date_format(''yyyyMMdd'') }}'
      end_date: '{{ params.end_date | date_format(''yyyyMMdd'') }}'
      curve_name: '{{ params.curve_name }}'
      page: 1
      page_size: 1000
dataset:
  id: analysis
  sources:
  - id: raw
    ref: '#/sources/remote'
  sql: SELECT CAST(trade_date AS VARCHAR) AS period,100*(TRY_CAST(y_10y AS DOUBLE)-TRY_CAST(y_1y AS DOUBLE)) AS
    spread FROM raw ORDER BY period
chart:
  dataset: analysis
  renderer: echarts
  option:
    tooltip:
      trigger: axis
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 58
      bottom: 30
      containLabel: true
    xAxis:
      type: time
      boundaryGap: false
    yAxis:
      type: value
      name: bp
      scale: false
    series:
    - id: spread
      name:
        i18n: series.spread
      type: line
      data:
        from: analysis
        x: period
        y: spread
      showSymbol: true
      symbolSize: 4
      connectNulls: false
      markLine:
        silent: true
        symbol: none
        label:
          show: false
        data:
        - yAxis: 0
