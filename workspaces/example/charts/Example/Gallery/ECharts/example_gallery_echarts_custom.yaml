params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
chart:
  id: example_gallery_echarts_custom
  title: ECharts · 自定义区间
  dataset: sample
  renderer: echarts
  tags:
  - 图表原型
  - ECharts
  - custom
  notes: 3 个虚构任务的区间，renderItem 使用 api.coord/api.size 转换坐标并裁剪矩形；单位为天。
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    xAxis:
      type: value
      min: 0
      max: 9
    yAxis:
      type: category
      data:
      - Design
      - Build
      - Test
    series:
    - type: custom
      renderItem: |-
        js: (params, api) => {
          const start = api.coord([api.value(0), api.value(2)]);
          const end = api.coord([api.value(1), api.value(2)]);
          const height = api.size([0, 1])[1] * 0.5;
          const shape = echarts.graphic.clipRectByRect(
            {x: start[0], y: start[1] - height / 2, width: end[0] - start[0], height},
            {x: params.coordSys.x, y: params.coordSys.y, width: params.coordSys.width, height: params.coordSys.height});
          return shape && {type: 'rect', shape, style: {fill: '#3b82f6'}};
        }
      encode:
        x:
        - 0
        - 1
        y: 2
      data:
      - - 1
        - 3
        - 0
      - - 2
        - 6
        - 1
      - - 5
        - 8
        - 2
