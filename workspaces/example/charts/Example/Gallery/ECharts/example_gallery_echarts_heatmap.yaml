i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 热力图
      en: ECharts · Heatmap
    notes:
      zh-Hans: '比较 3 天内线上与门店的 6 个虚构数值，颜色深浅表示大小。数值为演示单位，可离线查看。'
      en: 'Compare six fictional values for web and store channels over three days. Color intensity indicates magnitude, in demonstration units. Works offline.'
    web:
      zh-Hans: 线上
      en: Web
    store:
      zh-Hans: 门店
      en: Store

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_heatmap
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - heatmap
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    grid:
      top: 24
      bottom: 65
      left: 12
      right: 12
      containLabel: true
    xAxis:
      type: category
      data:
      - Mon
      - Tue
      - Wed
    yAxis:
      type: category
      data:
      - {i18n: web}
      - {i18n: store}
    visualMap:
      min: 0
      max: 6
      orient: horizontal
      left: center
      bottom: 0
      calculable: false
    series:
    - id: series_1
      type: heatmap
      data:
      - - 0
        - 0
        - 2
      - - 1
        - 0
        - 5
      - - 2
        - 0
        - 3
      - - 0
        - 1
        - 4
      - - 1
        - 1
        - 1
      - - 2
        - 1
        - 6
      label:
        show: true
