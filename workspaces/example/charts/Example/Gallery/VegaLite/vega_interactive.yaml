i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Filter region interactively
      zh-Hans: Vega-Lite · 地区交互筛选
    notes:
      en: 'Choose a region from the dropdown to view its monthly revenue trend. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '使用地区下拉选项，查看所选地区的月度收入趋势。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_interactive
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    mark:
      type: line
      point: true
      tooltip: true
    encoding:
      x:
        field: month
        type: temporal
        timeUnit: yearmonth
        axis:
          format: '%b'
          labelOverlap: true
        title: Month
      y:
        aggregate: sum
        field: revenue
        type: quantitative
        title: Revenue (demo units)
      color:
        field: region
        type: nominal
        title: Region
    params:
    - name: region_filter
      value: East
      bind:
        input: select
        options:
        - East
        - West
        name: 'Region: '
    transform:
    - filter: datum.region === region_filter
