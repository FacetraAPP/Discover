i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      en: Vega-Lite · Revenue with labels
      zh-Hans: Vega-Lite · 收入与标签叠加
    notes:
      en: 'View monthly revenue totals, with values labeled above each bar. Uses fictional product sales for January–June 2026, with amounts in demonstration units. No connection or network required.'
      zh-Hans: '查看每月收入总额，柱顶标签显示对应数值。使用 2026 年 1–6 月的虚构产品销售数据，金额为演示单位；无需连接或网络。'
metadata:
  id: vega_layer
  title:
    i18n: title
  notes:
    i18n: notes
  tags:
  - Renderer Gallery
  - vega_lite
params: []
sources: {}
dataset:
  id: sales
  ref: vega_bar.yaml#/dataset
chart:
  dataset: sales
  renderer: vega_lite
  option:
    data:
      values:
        from: sales
        rows: true
    encoding:
      x:
        field: month
        type: temporal
        timeUnit: yearmonth
        axis:
          format: '%b'
          labelOverlap: true
        title: Month
      y:
        aggregate: sum
        field: revenue
        type: quantitative
        title: Revenue (demo units)
    layer:
    - mark:
        type: bar
        tooltip: true
    - mark:
        type: text
        dy: -8
      encoding:
        text:
          aggregate: sum
          field: revenue
          type: quantitative
          format: .0f
