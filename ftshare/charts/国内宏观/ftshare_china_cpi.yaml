params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-cpi
    format: json
    recordsPath:
    - data
    - items
    params:
      page: 1
      page_size: '{{ params.periods }}'
dataset:
  id: cpi_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH normalized AS (
      SELECT regexp_extract(month, '([0-9]{4})年', 1) || '-' || lpad(regexp_extract(month, '年([0-9]{1,2})月', 1), 2, '0') AS period,
             TRY_CAST(national_yoy AS DOUBLE) AS national_yoy,
             TRY_CAST(national_mom AS DOUBLE) AS national_mom,
             TRY_CAST(city_yoy AS DOUBLE) AS city_yoy,
             TRY_CAST(rural_yoy AS DOUBLE) AS rural_yoy
      FROM raw
    )
    SELECT * FROM (
      SELECT * FROM normalized WHERE period <> ''
      ORDER BY period DESC
      LIMIT $periods
    ) AS recent ORDER BY period
chart:
  id: ftshare_china_cpi
  title: CPI · 同比与环比
  dataset: cpi_data
  renderer: echarts
  notes: |-
    观察居民消费价格的同比趋势与短期环比变化，比较全国、城市和农村。单位：%。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/0v982m8z
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: cpi_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: false
    series:
    - name: 全国同比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: cpi_data
        field: national_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 全国环比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: cpi_data
        field: national_mom
      symbolSize: 4
      showAllSymbol: auto
    - name: 城市同比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: cpi_data
        field: city_yoy
      symbolSize: 4
      showAllSymbol: auto
    - name: 农村同比
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: cpi_data
        field: rural_yoy
      symbolSize: 4
      showAllSymbol: auto
