i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: ECharts · 仪表盘
      en: ECharts · Gauge
    notes:
      zh-Hans: 虚构完成率 72%；百分比范围固定为 0–100。数据内嵌 chart.option。
      en: A fictional completion rate of 72%, on a fixed 0–100 percent scale. Data is embedded in chart.option.
    completion:
      zh-Hans: 完成率
      en: Completion

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
metadata:
  id: example_gallery_echarts_gauge
  title: {i18n: title}
  tags:
  - 图表原型
  - ECharts
  - gauge
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: echarts
  option:
    animation: false
    tooltip:
      trigger: item
      confine: true
    series:
    - id: series_1
      type: gauge
      radius: 80%
      min: 0
      max: 100
      splitNumber: 5
      progress:
        show: true
        width: 12
      axisLine:
        lineStyle:
          width: 12
      axisLabel:
        distance: 16
        fontSize: 10
      detail:
        formatter: '{value}%'
        fontSize: 26
      data:
      - name: {i18n: completion}
        value: 72
