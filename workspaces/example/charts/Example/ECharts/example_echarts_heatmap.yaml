i18n:
  defaultLocale: zh-Hans
  messages:
    metric:
      zh-Hans: 指标
      en: Metric
    title:
      zh-Hans: ECharts · 渠道月度热力图
      en: ECharts · Monthly channel heatmap
    notes:
      zh-Hans: '与收入图共享 CSV source，SQL 将宽表转换为 [月份索引, 渠道索引, 数值]。

        切换 revenue / profit 查看收入或分摊成本后的利润，单位为万元。色阶、标签和坐标轴均由 option 配置。

        ECharts dataset 按渠道过滤为两组系列，让提示框同时显示月份、渠道与金额单位。'
      en: 'Shares the revenue chart’s CSV source. SQL unpivots the data into [month
        index, channel index, value].

        Choose revenue or profit after allocated costs, in units of CNY 10,000. The
        option defines the color scale, labels and axes.

        ECharts dataset filters each channel into its own series so tooltips retain
        the month, channel and amount unit.'
    online:
      zh-Hans: 线上
      en: Online
    store:
      zh-Hans: 门店
      en: Store
    month_1:
      zh-Hans: 1月
      en: Jan
    month_2:
      zh-Hans: 2月
      en: Feb
    month_3:
      zh-Hans: 3月
      en: Mar
    month_4:
      zh-Hans: 4月
      en: Apr
    month_5:
      zh-Hans: 5月
      en: May
    month_6:
      zh-Hans: 6月
      en: Jun
    month_7:
      zh-Hans: 7月
      en: Jul
    month_8:
      zh-Hans: 8月
      en: Aug
    month_9:
      zh-Hans: 9月
      en: Sep
    month_10:
      zh-Hans: 10月
      en: Oct
    month_11:
      zh-Hans: 11月
      en: Nov
    month_12:
      zh-Hans: 12月
      en: Dec
    online_amount:
      zh-Hans: 线上（万元）
      en: Online (CNY 10,000)
    store_amount:
      zh-Hans: 门店（万元）
      en: Store (CNY 10,000)
params:
- name: metric
  label:
    i18n: metric
  type: string
  default: revenue
  options:
  - revenue
  - profit
sources:
  sales:
    ref: example_echarts_business.yaml#/sources/sales
dataset:
  id: cells
  sources:
  - id: raw
    ref: '#/sources/sales'
  sql: "WITH sales AS (\n  SELECT month, CAST(online AS DOUBLE) AS online, CAST(retail\
    \ AS DOUBLE) AS retail,\n         CAST(cost AS DOUBLE) AS cost FROM raw\n)\nSELECT\
    \ CAST(substr(month, 6, 2) AS INTEGER) - 1 AS month_index, 0 AS channel_index,\n\
    \       CASE WHEN $metric = 'profit' THEN round(online - cost * online / (online\
    \ + retail), 1) ELSE online END AS value\nFROM sales\nUNION ALL\nSELECT CAST(substr(month,\
    \ 6, 2) AS INTEGER) - 1, 1,\n       CASE WHEN $metric = 'profit' THEN round(retail\
    \ - cost * retail / (online + retail), 1) ELSE retail END\nFROM sales ORDER BY\
    \ channel_index, month_index\n"
metadata:
  tags:
  - 经营
  - 渠道
  - 热力图
  - ECharts
  id: example_echarts_heatmap
  title:
    i18n: title
  notes:
    i18n: notes
chart:
  dataset: cells
  renderer: echarts
  option:
    tooltip:
      position: top
    grid:
      left: 10
      right: 12
      top: 30
      bottom: 80
      containLabel: true
    xAxis:
      type: category
      data:
      - i18n: month_1
      - i18n: month_2
      - i18n: month_3
      - i18n: month_4
      - i18n: month_5
      - i18n: month_6
      - i18n: month_7
      - i18n: month_8
      - i18n: month_9
      - i18n: month_10
      - i18n: month_11
      - i18n: month_12
      splitArea:
        show: true
    yAxis:
      type: category
      data:
      - i18n: online
      - i18n: store
      splitArea:
        show: true
    visualMap:
      min: 0
      max: 150
      calculable: true
      orient: horizontal
      left: center
      bottom: 8
      inRange:
        color:
        - '#e0f2fe'
        - '#38bdf8'
        - '#0369a1'
    series:
    - type: heatmap
      data:
        from: cells
        fields:
        - month_index
        - channel_index
        - value
      label:
        show: true
        fontSize: 10
      emphasis:
        itemStyle:
          borderColor: '#f59e0b'
          borderWidth: 2
    media:
    - query:
        minWidth: 481
      option:
        series:
        - label:
            show: true
    - query:
        maxWidth: 480
      option:
        grid:
          left: 6
          right: 6
          top: 12
          bottom: 58
          containLabel: true
        xAxis:
          axisLabel:
            interval: 1
        series:
        - label:
            show: false
        visualMap:
          calculable: false
          itemWidth: 10
          itemHeight: 120
          textStyle:
            fontSize: 10
    - query:
        maxHeight: 190
      option:
        grid:
          top: 8
          bottom: 18
        visualMap:
          show: false
        series:
        - label:
            show: false
