i18n:
  defaultLocale: zh-Hans
  messages:
    title:
      zh-Hans: Facetra · 数值卡片
      en: Facetra · Value card
    notes:
      zh-Hans: '展示 4 个虚构数值的合计 75，单位为演示单位。'
      en: 'The sum of four fictional values is 75, in demonstration units.'

params: []
sources:
  sample:
    source: duckdb
    file: data/example/gallery-categories.csv
dataset:
  id: sample
  sources:
  - id: raw
    ref: '#/sources/sample'
  sql: |
    SELECT SUM(CAST(value AS DOUBLE)) AS total FROM raw
metadata:
  id: example_gallery_swift_value
  title: {i18n: title}
  tags:
  - 图表原型
  - Swift Charts
  - value
  notes: {i18n: notes}
chart:
  dataset: sample
  renderer: value
  value: total
