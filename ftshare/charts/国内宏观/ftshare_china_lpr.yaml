params:
- name: periods
  label: 显示最近（期数）
  type: integer
  default: 24
  minimum: 1
  maximum: 200
  options:
  - 6
  - 12
  - 24
  - 36
  - 60
  - 120
  - 200
sources:
  macro:
    source: http
    method: get
    url: https://market.ft.tech/gateway/api/v1/market/data/economic/china-lpr
    format: json
    recordsPath:
    - data
dataset:
  id: lpr_data
  sources:
  - id: raw
    ref: '#/sources/macro'
  sql: |-
    WITH monthly AS (
      SELECT substr(CAST(date AS VARCHAR), 1, 7) AS period,
             TRY_CAST(lpr_1y AS DOUBLE) AS lpr_1y,
             TRY_CAST(lpr_5y AS DOUBLE) AS lpr_5y,
             row_number() OVER (PARTITION BY substr(CAST(date AS VARCHAR), 1, 7) ORDER BY date DESC) AS rank
      FROM raw
    ), recent AS (
      SELECT period, lpr_1y, lpr_5y FROM monthly
      WHERE rank = 1
      ORDER BY period DESC
      LIMIT $periods
    )
    SELECT * FROM recent ORDER BY period
chart:
  tags: ["国内宏观", "利率", "贷款", "LPR"]
  id: ftshare_china_lpr
  title: LPR · 贷款市场报价利率
  dataset: lpr_data
  renderer: echarts
  notes: |-
    观察 1 年期与 5 年期贷款市场报价利率及调降节点。阶梯线表示报价沿用。单位：%。

    可选择显示期数；横轴按时间升序排列。点击曲线查看日期和数值，点击图例可显示或隐藏曲线；缺失数据不补零。
    历史按月保留最后一条报价；5 年期在 2019-08-20 前缺失。
    数据来源：FTShare。文档：https://market.ft.tech/gateway/doc/p/wg95club
  option:
    tooltip:
      trigger: axis
      valueFormatter: 'js:(value) => value == null ? ''—'' : Number(value).toFixed(2) + ''%'''
    legend:
      type: scroll
      top: 0
    grid:
      left: 12
      right: 24
      top: 52
      bottom: 30
      containLabel: true
    xAxis:
      type: category
      boundaryGap: false
      data:
        from: lpr_data
        field: period
    yAxis:
      type: value
      name: '%'
      scale: true
      min: js:(e) => Math.floor((e.min - 0.05) * 100) / 100
      max: js:(e) => Math.ceil((e.max + 0.05) * 100) / 100
      axisLabel:
        formatter: js:(value) => Number(value).toFixed(2)
    series:
    - name: 1 年期
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: lpr_data
        field: lpr_1y
      step: end
      symbolSize: 4
      showAllSymbol: auto
    - name: 5 年期
      type: line
      showSymbol: true
      connectNulls: false
      data:
        from: lpr_data
        field: lpr_5y
      step: end
      symbolSize: 4
      showAllSymbol: auto
